<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Побег тюленьки</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
.top { flex: 0 0 auto; padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 2px; align-items: center; background: #000; }
h1 { margin: 0; font-size: clamp(16px, 2.6vw + 12px, 22px); line-height: 1.2; text-shadow: 0 1px 4px #000; }
a.back { color: #7fd4ff; font-size: 13px; line-height: 1.4; text-shadow: 0 1px 4px #000; text-decoration: none; }
a.back:hover { text-decoration: underline; }
.stage { flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; background: #000; padding: 0 8px; }
canvas { background: #0e2233; touch-action: none; display: block; margin: 0; }
#game { position: relative; inset: auto; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
p.hint { flex: 0 0 auto; margin: 6px 0 4px; padding: 0 12px; color: #9fb3c0; font-size: 13px; line-height: 1.4; text-shadow: 0 1px 4px #000; }
.pad { flex: 0 0 auto; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 0; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); }
.pad button { font-size: 28px; min-width: 72px; width: 72px; height: 64px; border-radius: 12px; border: 1px solid #555; background: #1d2f3d; color: #fff; touch-action: none; }
.pad button:active { background: #2e4a5f; }
</style>
</head>
<body>
<div class="top">
<h1>Побег тюленьки</h1>
<a class="back" href="https://hub.bratuxa.zomb.top">← назад в общий дом</a>
</div>
<div class="stage">
<canvas id="game" width="960" height="540"></canvas>
</div>
<p class="hint">Стрелки или палец — идти, в часы работы встань к станку, подбирай вещи и собирай из них, дело часа зовёт на поверку и еду, взгляд стражи ловит, три розыска — карцер. Ночью у торговца рядом с нашими клавиша T меняет монеты на вещи.</p>
<div class="pad">
<button id="btn-left" aria-label="влево">◀</button>
<button id="btn-right" aria-label="вправо">▶</button>
<button id="btn-jump" aria-label="прыжок">▲</button>
<button id="btn-shove" aria-label="толкнуть">✋</button>
</div>
<script src="game.js"></script>
<script>
(function () {
  function track() {
    try {
      var url = 'https://hub.bratuxa.zomb.top/api/track?SITE=tulenko';
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, 'SITE=tulenko');
      } else {
        fetch(url + '&_=' + Date.now(), { mode: 'no-cors', keepalive: true }).catch(function () {});
      }
    } catch (e) {}
  }
  track();
  setInterval(track, 30000);
})();
</script>
</body>
</html>
