<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Побег тюленьки</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; }
body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 0; height: 100dvh; overflow: hidden; }
#game { position: fixed; inset: 0; width: 100vw; height: 100dvh; background: #000; touch-action: none; display: block; margin: 0; }
.top { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 2px; align-items: center; pointer-events: none; background: linear-gradient(to bottom, rgba(0,0,0,0.65), rgba(0,0,0,0)); }
h1 { margin: 0; font-size: clamp(16px, 2.6vw + 12px, 22px); line-height: 1.2; text-shadow: 0 1px 4px #000; }
a.back { color: #7fd4ff; font-size: 13px; line-height: 1.4; text-shadow: 0 1px 4px #000; text-decoration: none; pointer-events: auto; }
a.back:hover { text-decoration: underline; }
p.hint { position: fixed; left: 0; right: 0; bottom: calc(86px + env(safe-area-inset-bottom)); z-index: 5; margin: 0; padding: 6px 12px; color: #9fb3c0; font-size: 13px; line-height: 1.4; text-shadow: 0 1px 4px #000; pointer-events: none; background: linear-gradient(to top, rgba(0,0,0,0.55), rgba(0,0,0,0)); }
.pad { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 0; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); pointer-events: none; }
.pad button { font-size: 28px; min-width: 72px; width: 72px; height: 64px; border-radius: 12px; border: 1px solid #555; background: #1d2f3d; color: #fff; touch-action: none; pointer-events: auto; }
.pad button:active { background: #2e4a5f; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div class="top">
<h1>Побег тюленьки</h1>
<a class="back" href="https://hub.bratuxa.zomb.top">← назад в общий дом</a>
</div>
<p class="hint">Стрелки или палец — идти, в часы работы встань к станку, подбирай вещи и собирай из них, дело часа зовёт на поверку и еду, взгляд стражи ловит, три розыска — карцер. Ночью у торговца рядом с нашими клавиша T меняет монеты на вещи.</p>
<div class="pad">
<button id="btn-left" aria-label="влево">◀</button>
<button id="btn-right" aria-label="вправо">▶</button>
<button id="btn-jump" aria-label="прыжок">▲</button>
<button id="btn-shove" aria-label="толкнуть">✋</button>
</div>
<script src="game.js"></script>
<script>
(function () {
  function track() {
    try {
      var url = 'https://hub.bratuxa.zomb.top/api/track?SITE=tulenko';
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, 'SITE=tulenko');
      } else {
        fetch(url + '&_=' + Date.now(), { mode: 'no-cors', keepalive: true }).catch(function () {});
      }
    } catch (e) {}
  }
  track();
  setInterval(track, 30000);
})();
</script>
</body>
</html>
