<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Побег тюленьки</title>
<link rel="icon" href="data:,">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
body { background: #000; color: #fff; font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
a.back { color: #7fd4ff; }
canvas { background: #0e2233; touch-action: none; display: block; margin: 0; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; }
h1 { position: fixed; top: 8px; left: 0; right: 0; margin: 0; z-index: 5; pointer-events: none; font-size: 20px; text-shadow: 0 1px 4px #000; }
a.back { position: fixed; top: 34px; left: 0; right: 0; z-index: 5; font-size: 13px; text-shadow: 0 1px 4px #000; }
.pad { position: fixed; left: 0; right: 0; bottom: 12px; display: flex; gap: 12px; justify-content: center; margin: 0; z-index: 5; }
.pad button { font-size: 28px; width: 72px; height: 64px; border-radius: 12px; border: 1px solid #555; background: #1d2f3d; color: #fff; touch-action: none; }
.pad button:active { background: #2e4a5f; }
p.hint { position: fixed; left: 0; right: 0; bottom: 84px; margin: 0; padding: 0 12px; color: #9fb3c0; font-size: 13px; z-index: 5; pointer-events: none; text-shadow: 0 1px 4px #000; }
</style>
</head>
<body>
<h1>Побег тюленьки</h1>
<a class="back" href="https://hub.bratuxa.zomb.top">← назад в общий дом</a>
<canvas id="game" width="960" height="540"></canvas>
<div class="pad">
<button id="btn-left" aria-label="влево">◀</button>
<button id="btn-right" aria-label="вправо">▶</button>
<button id="btn-jump" aria-label="прыжок">▲</button>
<button id="btn-shove" aria-label="толкнуть">✋</button>
</div>
<p class="hint">Стрелки или палец — идти, в часы работы встань к станку, подбирай вещи и собирай из них, дело часа зовёт на поверку и еду, взгляд стражи ловит, три розыска — карцер. Ночью у торговца рядом с нашими клавиша T меняет монеты на вещи.</p>
<script src="game.js"></script>
<script>
(function () {
  function track() {
    try {
      var url = 'https://hub.bratuxa.zomb.top/api/track?SITE=tulenko';
      if (navigator.sendBeacon) {
        navigator.sendBeacon(url, 'SITE=tulenko');
      } else {
        fetch(url + '&_=' + Date.now(), { mode: 'no-cors', keepalive: true }).catch(function () {});
      }
    } catch (e) {}
  }
  track();
  setInterval(track, 30000);
})();
</script>
</body>
</html>
