global:
  resolve_timeout: 1m

route:
  receiver: telegram
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Канал доставки — сам Amigo 43: крон `infra-watch-42` каждые 5 мин опрашивает
  # Prometheus/Alertmanager скриптом infra/watch.py и пишет в этот чат, если горит.
  # Отдельный Telegram-бот НЕ нужен (решение Miqqil).
  # Запасной вариант: раскомментить telegram_configs, вписать токен + chat id
  # (секрет — только на сервере, не в git), `docker compose up -d alertmanager`.
  - name: telegram
