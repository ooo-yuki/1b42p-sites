<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Додекаэдр Чаева 42 🔷</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #070b18; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #scene { position: fixed; inset: 0; }
  #sign {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: #0d1428; border: 3px solid #E31E25; border-radius: 14px;
    padding: 10px 22px; font-weight: 900; font-size: clamp(15px, 3.4vw, 24px);
    letter-spacing: .02em; color: #fff; text-shadow: 0 0 14px rgba(227,30,37,.8);
    box-shadow: 0 6px 28px rgba(227,30,37,.45); white-space: nowrap; z-index: 10;
  }
  #hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    font-size: 14px; color: #bbb; background: rgba(0,0,0,.5);
    padding: 8px 18px; border-radius: 999px; white-space: nowrap; z-index: 10;
  }
  #hint a { color: #ffd700; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="sign">ЗЕЛЁНЫМ ГОБЛИНАМ ВХОД ВОСПРЕЩЁН</div>
<div id="hint">Тащи мышью — крути • <a href="./">← на сайт Чаева</a></div>
<script>
var scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x070b18, 18, 46);
var camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 9);
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.getElementById('scene').appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8899bb, 1.3));
var sun = new THREE.DirectionalLight(0xfff2cc, 2.0);
sun.position.set(6, 10, 7);
sun.castShadow = true;
renderer.shadowMap.enabled = true;
scene.add(sun);
var rim = new THREE.PointLight(0x0060AA, 60, 40);
rim.position.set(-7, 3, -5);
scene.add(rim);
var rim2 = new THREE.PointLight(0xE31E25, 50, 40);
rim2.position.set(7, -2, -6);
scene.add(rim2);

var jewel = new THREE.Group();
scene.add(jewel);

// Ядро — додекаэдр с гранями: отсылка к додека-семейству многогранников.
var core = new THREE.Mesh(
  new THREE.DodecahedronGeometry(2.0, 1),
  new THREE.MeshStandardMaterial({ color: 0x0d3a6e, metalness: .75, roughness: .3, flatShading: true })
);
core.castShadow = true;
jewel.add(core);

// Каркас поверх — видно каждую грань.
var cage = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.DodecahedronGeometry(2.0, 1)),
  new THREE.LineBasicMaterial({ color: 0xffd700 })
);
jewel.add(cage);

// Внутренний икосаэдр — светится сквозь грани.
var inner = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1.15, 0),
  new THREE.MeshStandardMaterial({ color: 0xE31E25, emissive: 0x8F1218, metalness: .4, roughness: .4, flatShading: true })
);
jewel.add(inner);

// 12 пентаграмм-звёзд на вершинах додекаэдра — характер «звёздчатого» uniform-многогранника.
function starShape(R, r) {
  var s = new THREE.Shape();
  for (var i = 0; i < 10; i++) {
    var rad = (i % 2 === 0) ? R : r;
    var a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    var x = Math.cos(a) * rad, y = Math.sin(a) * rad;
    if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath();
  return s;
}
var starGeo = new THREE.ExtrudeGeometry(starShape(0.5, 0.21), { depth: 0.12, bevelEnabled: false });
var starMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: .9, roughness: .25, flatShading: true });
var dodecVerts = new THREE.DodecahedronGeometry(2.0, 0).attributes.position;
var seen = {}, stars = 0;
for (var i = 0; i < dodecVerts.count && stars < 12; i++) {
  var vx = dodecVerts.getX(i).toFixed(2), vy = dodecVerts.getY(i).toFixed(2), vz = dodecVerts.getZ(i).toFixed(2);
  var key = vx + ',' + vy + ',' + vz;
  if (seen[key]) continue;
  seen[key] = 1; stars++;
  var st = new THREE.Mesh(starGeo, starMat);
  st.position.set(parseFloat(vx), parseFloat(vy), parseFloat(vz)).multiplyScalar(1.02);
  st.lookAt(0, 0, 0);
  st.castShadow = true;
  jewel.add(st);
}

// Пыль 42 вокруг.
var dustGeo = new THREE.BufferGeometry();
var dp = [];
for (var d = 0; d < 160; d++) {
  dp.push((Math.random() - .5) * 22, Math.random() * 10 - 2, (Math.random() - .5) * 22);
}
dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
jewel.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0xffd700, size: 0.07 })));

// Вращение: авто + мышью.
var vyaw = 0, vpitch = 0.15, dragging = false, px = 0, py = 0, auto = true;
var el = renderer.domElement;
el.addEventListener('pointerdown', function (e) { dragging = true; px = e.clientX; py = e.clientY; auto = false; });
window.addEventListener('pointerup', function () { dragging = false; });
window.addEventListener('pointermove', function (e) {
  if (!dragging) return;
  vyaw += (e.clientX - px) * 0.008;
  vpitch = Math.max(-1.2, Math.min(1.2, vpitch + (e.clientY - py) * 0.005));
  px = e.clientX; py = e.clientY;
});
window.addEventListener('resize', function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

var t = 0;
(function loop() {
  requestAnimationFrame(loop);
  t += 0.016;
  if (auto) vyaw += 0.006;
  jewel.rotation.y = vyaw;
  jewel.rotation.x = vpitch + Math.sin(t * 0.6) * 0.06;
  jewel.position.y = Math.sin(t * 0.9) * 0.15;
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
