document.getElementById('bg').src = IMGS[1];
const COLORS = ['#FFFFFF', '#E31E25', '#0060AA', '#f0f0f0'];

function rand(min, max) { return Math.random() * (max - min) + min; }

function makeBouncer(kind, index) {
  const el = document.createElement('div');
  el.className = 'bouncer';

  let w, h;
  if (kind === 'img') {
    const im = document.createElement('img');
    im.src = IMGS[0];
    im.alt = '';
    im.className = 'bimg' + (index % 2 ? ' red' : '');
    el.appendChild(im);
    w = 130; h = 130;
  } else {
    el.classList.add('btext');
    el.textContent = 'САША';
    el.style.color = COLORS[index % COLORS.length];
    document.body.appendChild(el);
    const rect = el.getBoundingClientRect();
    w = rect.width; h = rect.height;
    document.body.removeChild(el);
  }

  const obj = {
    el, w, h,
    x: rand(0, Math.max(1, window.innerWidth - w)),
    y: rand(0, Math.max(1, window.innerHeight - h)),
    vx: (Math.random() < 0.5 ? -1 : 1) * rand(2.2, 4.5),
    vy: (Math.random() < 0.5 ? -1 : 1) * rand(2.2, 4.5),
  };
  stage.appendChild(el);
  return obj;
}

const bouncers = [];
for (let i = 0; i < 6; i++) bouncers.push(makeBouncer('img', i));
for (let i = 0; i < 6; i++) bouncers.push(makeBouncer('text', i));

function recolor(b) {
  if (b.el.classList.contains('btext')) {
    b.el.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
  }
}

function tick() {
  const W = window.innerWidth, H = window.innerHeight;
  for (const b of bouncers) {
    b.x += b.vx;
    b.y += b.vy;

    let bounced = false;
    if (b.x <= 0) { b.x = 0; b.vx *= -1; bounced = true; }
    if (b.x + b.w >= W) { b.x = W - b.w; b.vx *= -1; bounced = true; }
    if (b.y <= 0) { b.y = 0; b.vy *= -1; bounced = true; }
    if (b.y + b.h >= H) { b.y = H - b.h; b.vy *= -1; bounced = true; }
    if (bounced) recolor(b);

    b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
  }
  requestAnimationFrame(tick);
}

window.addEventListener('resize', () => {
  for (const b of bouncers) {
    b.x = Math.min(b.x, Math.max(0, window.innerWidth - b.w));
    b.y = Math.min(b.y, Math.max(0, window.innerHeight - b.h));
  }
});

requestAnimationFrame(tick);
</script>
