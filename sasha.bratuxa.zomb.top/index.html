<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Саша ⁴² — 42</title>
<!-- 42 -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a18;font-family:system-ui,sans-serif}
#sky{position:fixed;inset:0;background:linear-gradient(135deg,#7a0e0e 0%,#0a0a18 45%,#0a0a18 55%,#0e2a7a 100%)}
canvas{position:fixed;inset:0}
#hero{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#hero h1{font-size:min(18vw,140px);margin:0;color:#fff;text-shadow:0 0 30px #ff2a2a,0 0 60px #2a5bff}
#hero h1 .r{color:#ff4d4d}#hero h1 .b{color:#4d7bff}
#hero p{color:#cfd6ff;font-size:min(5vw,22px);text-shadow:0 2px 8px #000}
#hint{position:fixed;bottom:12px;width:100%;text-align:center;color:#8a93c9;font-size:14px;pointer-events:none}
#secret{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,5,20,.92);z-index:10;color:#ffd23f;text-align:center}
#secret .big{font-size:min(30vw,220px)}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="cv"></canvas>
<div id="hero"><h1><span class="r">4</span><span class="b">2</span></h1><p>страница Саши ⁴² · стройка началась 🏗️<br>тыкай — вылетают цифры · набери 42 — будет секрет</p></div>
<div id="hint">а ещё 42 спрятаны… ищи 👀</div>
<div id="secret"><div class="big">4️⃣2️⃣</div><h2>ТЫ НАШЁЛ ВСЕ 42, САША!</h2><p>Мы уже победили 🏆</p></div>
<!-- тут тоже 42 -->
<script>
/* Саша ⁴² · летящие цифры · v1 */
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),P=[],score=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight;}fit();addEventListener('resize',fit);
function spawn(x,y,big){
 P.push({x:x==null?Math.random()*cv.width:x,y:y==null?-40:y,
  vx:(Math.random()-0.5)*1.6,vy:1+Math.random()*2.2,
  s:big?46+Math.random()*40:14+Math.random()*26,
  r:Math.random()<0.5,ph:Math.random()*6.28});
}
for(var i=0;i<42;i++)spawn(Math.random()*innerWidth,Math.random()*innerHeight);
setInterval(function(){if(P.length<142)spawn();},400);
function burst(x,y){for(var i=0;i<42;i++)spawn(x,y);score+=42;
 if(score>=42*42){document.getElementById('secret').style.display='flex';}}
document.getElementById('secret').onclick=function(){this.style.display='none';score=0;};
addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY);});
/* скрытая 42: жми 4 потом 2 */
var seq='';
addEventListener('keydown',function(e){
 seq=(seq+e.key).slice(-2);
 if(seq==='42')document.getElementById('secret').style.display='flex';
});
(function loop(){
 ctx.clearRect(0,0,cv.width,cv.height);
 var t=Date.now()/1000;
 for(var i=P.length-1;i>=0;i--){var p=P[i];
  p.x+=p.vx+Math.sin(t*2+p.ph)*0.6;p.y+=p.vy;
  if(p.y>cv.height+60){P.splice(i,1);continue;}
  ctx.font='bold '+p.s+'px system-ui';ctx.textAlign='center';
  ctx.fillStyle=p.r?'rgba(255,70,70,.85)':'rgba(90,140,255,.85)';
  ctx.shadowColor=p.r?'#ff2a2a':'#2a5bff';ctx.shadowBlur=14;
  ctx.fillText('42',p.x,p.y);
 }
 ctx.shadowBlur=0;
 requestAnimationFrame(loop);
})();
console.log('%c42','font-size:60px;color:#ff4d4d');
console.log('Саша, тут спрятано 42 раза по 42. Мы уже победили 🏆');
</script>
<script>/* 42-трекер онлайна */(function(){var SITE='sasha';try{var s=null;try{s=localStorage.getItem('t42_sid');}catch(e){}if(!s||!/^[0-9a-f]{32}$/.test(s)){s='';var h='0123456789abcdef';for(var i=0;i<32;i++)s+=h[Math.floor(Math.random()*16)];try{localStorage.setItem('t42_sid',s);}catch(e){}}function b(){try{fetch('https://hub.bratuxa.zomb.top/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({site:SITE,sid:s}),keepalive:true}).catch(function(){});}catch(e){}}b();setInterval(b,30000);}catch(e){}})();</script>
</body>
</html>
