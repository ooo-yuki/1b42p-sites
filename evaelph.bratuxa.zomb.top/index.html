<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧝 Эввград — 3D город эльфов!</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
:root{--cream:#fffdf4;--ink:#2f5d3a;--berry:#ff7bac;--leaf:#58b368;--gold:#ffd23f;--sky:#cdeffd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;color:var(--ink)}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
/* верхняя панель */
#topbar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;z-index:10}
#cityTag{pointer-events:auto;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 16px;
font-weight:bold;font-size:18px;box-shadow:0 4px 0 rgba(47,93,58,.35)}
#cityTag small{display:block;font-size:11px;font-weight:normal;opacity:.75}
#cityTag a{color:var(--ink);text-decoration:none;font-size:11px}
#resbar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.res{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:bold;font-size:14px;
box-shadow:0 3px 0 rgba(47,93,58,.3);white-space:nowrap}
.res b{color:#d63d6e}
/* док стройки */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:8px;align-items:stretch;
background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:10px 12px;z-index:10;max-width:96vw;overflow-x:auto;
box-shadow:0 6px 0 rgba(47,93,58,.35)}
.tool{flex:0 0 auto;border:3px solid transparent;background:#f3f9ec;border-radius:16px;padding:8px 10px;min-width:76px;cursor:pointer;
text-align:center;font-size:12px;font-weight:bold;color:var(--ink);box-shadow:0 3px 0 rgba(47,93,58,.25);transition:transform .08s}
.tool:active{transform:translateY(2px);box-shadow:none}
.tool .em{font-size:26px;display:block}
.tool small{display:block;font-weight:normal;font-size:10px;opacity:.8}
.tool.active{border-color:var(--berry);background:#ffe9f2}
.tool.cant{opacity:.55}
.tool.bulldoze{background:#ffe3e3}
/* инспектор */
#inspector{position:fixed;right:10px;top:76px;width:230px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;
padding:14px;z-index:10;display:none;box-shadow:0 6px 0 rgba(47,93,58,.35)}
#inspector h3{margin:0 0 4px;font-size:18px}
#inspector .stars{color:#e8a100;font-size:15px;letter-spacing:2px}
#inspector p{font-size:13px;margin:6px 0}
#inspector button{width:100%;margin-top:6px;border:none;border-radius:14px;padding:10px;font-weight:bold;font-size:14px;cursor:pointer}
#upBtn{background:var(--gold);color:#5d4a00;box-shadow:0 3px 0 #b98f00}
#upBtn:active{transform:translateY(2px);box-shadow:none}
#upBtn:disabled{opacity:.45}
#demoBtn{background:#ffd9d9;color:#a33;box-shadow:0 3px 0 #c88}
#closeInsp{background:#eef5e6;color:var(--ink);box-shadow:0 3px 0 rgba(47,93,58,.3)}
/* тост */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:108px;background:var(--ink);color:#fff;font-size:14px;font-weight:bold;
padding:10px 20px;border-radius:999px;z-index:10;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
/* кнопка дара леса */
#giftBtn{position:fixed;right:12px;bottom:108px;z-index:10;border:3px solid var(--ink);background:var(--berry);color:#fff;
font-weight:bold;font-size:15px;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #a33e66}
#giftBtn:active{transform:translateY(2px);box-shadow:none}
/* магазин (шторка над доком) */
#shop{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:11;display:none;
background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:12px;max-width:96vw;width:470px;
box-shadow:0 8px 0 rgba(47,93,58,.35)}
#shop h4{margin:0 0 8px;font-size:17px}
#shopGrid{display:flex;gap:10px}
.shopCard{flex:1;border:3px solid var(--ink);border-radius:18px;background:#f3f9ec;padding:12px 8px;cursor:pointer;
text-align:center;color:var(--ink);box-shadow:0 3px 0 rgba(47,93,58,.25)}
.shopCard:active{transform:scale(.95)}
.shopCard .em{font-size:48px;display:block}
.shopCard b{font-size:15px}
.shopCard small{display:block;font-size:12px;margin-top:4px;min-height:30px}
.shopCard .cost{color:#d63d6e;font-weight:bold;font-size:13px;margin-top:6px}
@media(max-width:640px){#shop{bottom:172px}}
/* победа */
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(47,93,58,.45);z-index:20}
#winBox{background:var(--cream);border:4px solid var(--gold);border-radius:26px;padding:28px;max-width:340px;text-align:center;
box-shadow:0 0 40px var(--gold);font-size:17px}
#winBox button{margin-top:12px;background:var(--gold);border:none;border-radius:14px;padding:10px 26px;font-weight:bold;font-size:16px;cursor:pointer;color:#5d4a00}
/* всплывающие +N */
.floater{position:fixed;z-index:9;font-weight:bold;font-size:16px;color:#d63d6e;pointer-events:none;text-shadow:0 2px 0 #fff;
transition:transform 1.1s ease-out,opacity 1.1s}
@media(max-width:640px){
 #cityTag{font-size:14px;padding:6px 10px}
 .res{font-size:12px;padding:5px 9px}
 #inspector{top:auto;bottom:108px;right:8px;left:8px;width:auto}
 #giftBtn{bottom:170px;font-size:13px;padding:10px 14px}
 #toast{bottom:170px}
 .tool{min-width:66px}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="topbar">
 <div id="cityTag">🧝 Эввград <small><span id="popLine">0 жителей</span> · <a href="https://hub.bratuxa.zomb.top">← Хаб 1Б42П</a></small></div>
 <div id="resbar">
  <div class="res">🪙 <b id="gold">0</b></div>
  <div class="res">💧 <b id="mana">0</b></div>
  <div class="res">🌲 <b id="wood">0</b></div>
  <div class="res">🧝 <b id="pop">0</b>/<b id="cap">0</b></div>
 </div>
</div>
<div id="shop"><h4 id="shopTitle"></h4><div id="shopGrid"></div></div>
<div id="dock"></div>
<div id="inspector">
 <h3 id="inspName">🏠</h3>
 <div class="stars" id="inspStars">★☆☆</div>
 <p id="inspDesc"></p>
 <p id="inspProd"></p>
 <button id="upBtn">Улучшить</button>
 <button id="demoBtn">Снести</button>
 <button id="closeInsp">Закрыть</button>
</div>
<div id="toast"></div>
<button id="giftBtn">🎁 Дар леса</button>
<div id="win"><div id="winBox">🏆 <b>МЫ УЖЕ ПОБЕДИЛИ!</b> 🏆<br>Эввград достиг 42 жителей! Город сияет, лес поёт! 🧝🌲✨<br><button onclick="document.getElementById('win').style.display='none'">Ура! 🎉</button></div></div>
<script>
/* ================= ЭКОНОМИКА (сейвы совместимы со старой версией) ================= */
var KEY='elfograd42_v1';
var B={
 house:{em:'🏠',n:'Дом эльфа',cost:{gold:50,wood:20},house:4,desc:'Даёт жильё горожанам'},
 grove:{em:'🌲',n:'Роща',cost:{gold:30},prod:{wood:0.4},desc:'Выращивает дерево'},
 tower:{em:'🔮',n:'Башня маны',cost:{gold:80,wood:40},prod:{mana:0.3},desc:'Собирает ману'},
 market:{em:'🏪',n:'Рынок',cost:{gold:60,wood:30},prod:{gold:0.5},desc:'Торгует и даёт золото'},
 garden:{em:'🌸',n:'Сад',cost:{mana:40,wood:20},boost:1,desc:'Ускоряет весь доход и рост'},
 spire:{em:'🗼',n:'Шпиль 42',cost:{gold:300,wood:150,mana:100},prod:{gold:2,mana:1,wood:1},house:10,desc:'Венец города!'}
};
var ORDER=['house','grove','tower','market','garden','spire'];
var S,tool='house',bulldoze=false,selIdx=-1,openGroup=null;
/* разделы магазина (как в Clash of Clans): внизу только группы */
var GROUPS=[
 {id:'city',em:'🏠',n:'Город',items:['house','market']},
 {id:'nature',em:'🌲',n:'Природа',items:['grove','garden']},
 {id:'magic',em:'🔮',n:'Магия',items:['tower','spire']}
];
function def(){return{gold:120,mana:20,wood:60,pop:0,cells:Array(64).fill(null),lastSeen:Date.now(),win:false};}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||def();}catch(e){S=def();}
 if(!S.cells||S.cells.length!==64)S.cells=Array(64).fill(null);
 var now=Date.now(),dt=Math.min((now-(S.lastSeen||now))/1000,8*3600);
 if(dt>30){var g=prod().gold*dt;if(g>0){S.gold+=Math.floor(g);setTimeout(function(){toast('🌙 Пока тебя не было: +'+Math.floor(g)+' 🪙');},800);}}
 S.lastSeen=now;save();}
function save(){S.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function lvlMult(l){return l;}
function gardens(){return S.cells.filter(function(c){return c&&c.t==='garden';}).length;}
function prod(){var p={gold:0,mana:0,wood:0};
 S.cells.forEach(function(c){if(!c)return;var b=B[c.t],m=lvlMult(c.l);
  if(b.prod){for(var k in b.prod)p[k]+=b.prod[k]*m;}});
 var g=gardens();if(g>0){p.gold*=(1+g*0.2);p.mana*=(1+g*0.2);p.wood*=(1+g*0.2);}
 return p;}
function cap(){var c=0;S.cells.forEach(function(x){if(x&&B[x.t].house)c+=B[x.t].house*lvlMult(x.l);});return c;}
function canPay(cost){for(var k in cost)if((S[k]||0)<cost[k])return false;return true;}
function pay(cost){for(var k in cost)S[k]-=cost[k];}
function upCost(c){var base=B[c.t].cost,r={};for(var k in base)r[k]=Math.floor(base[k]*1.8*c.l);return r;}
var CEM={gold:'🪙',mana:'💧',wood:'🌲'};
function fmtCost(cost){var a=[];for(var k in cost)a.push(cost[k]+' '+CEM[k]);return a.join(' · ');}
/* звук-пузырик */
var AC=null;
function blip(f){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 if(AC.state==='suspended')AC.resume();var t=AC.currentTime;
 var o=AC.createOscillator(),g=AC.createGain();o.type='sine';
 o.frequency.setValueAtTime(f||520,t);o.frequency.exponentialRampToValueAtTime((f||520)*1.6,t+0.12);
 g.gain.setValueAtTime(0.12,t);g.gain.exponentialRampToValueAtTime(0.01,t+0.14);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+0.15);}catch(e){}}
/* ================= 3D-МИР ================= */
var TILE=2,N=8;
var scene,camera,renderer,raycaster,mouseV;
var tileMeshes=[],bGroups={},pops=[];
var yaw=0.6,dist=17,pitch=0.95;
var hoverIdx=-1;
function C(hex){return new THREE.Color(hex);}
function mat(hex,em,ei){return new THREE.MeshStandardMaterial({color:hex,roughness:0.85,metalness:0.02,
 flatShading:true,emissive:em||0x000000,emissiveIntensity:ei||0});}
function idx2xz(i){var r=Math.floor(i/N),c=i%N;return [(c-3.5)*TILE,(r-3.5)*TILE];}
function put(g,x,y,z){g.position.set(x,y,z);return g;}
function box(w,h,d,m){var x=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);x.castShadow=true;return x;}
function cone(r,h,s,m){var x=new THREE.Mesh(new THREE.ConeGeometry(r,h,s),m);x.castShadow=true;return x;}
function cyl(rt,rb,h,s,m){var x=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),m);x.castShadow=true;return x;}
function ico(r,m){var x=new THREE.Mesh(new THREE.IcosahedronGeometry(r,0),m);x.castShadow=true;return x;}
function octa(r,m){var x=new THREE.Mesh(new THREE.OctahedronGeometry(r,0),m);x.castShadow=true;return x;}
/* --- домики --- */
function buildHouse(l){var g=new THREE.Group();
 var wall=mat(0xfff3d6),roof=mat(0xff9e9e),wood=mat(0x8b5e3c);
 var h=0.7+l*0.35;
 var b=put(box(1.1,h,1.0,wall),0,h/2,0);g.add(b);
 var r=put(cone(0.95,0.6+l*0.15,4,roof),0,h+0.3+l*0.07,0);r.rotation.y=Math.PI/4;g.add(r);
 g.add(put(box(0.3,0.45,0.06,wood),0,0.22,0.51));
 g.add(put(box(0.22,0.22,0.06,mat(0xbfe8ff)),-0.3,0.45+l*0.1,0.51));
 g.add(put(box(0.22,0.22,0.06,mat(0xbfe8ff)),0.3,0.45+l*0.1,0.51));
 if(l>=2)g.add(put(box(0.18,0.5,0.18,wood),0.4,h+0.3,0)); // труба
 if(l>=3){var s=octa(0.14,mat(0xffd23f,0x6b4e00,0.5));s.position.set(0,h+0.85,0);g.add(s);} // звезда
 return g;}
function elfTree(x,z,s,blossom){var g=new THREE.Group();
 g.add(put(cyl(0.09*s,0.13*s,0.5*s,5,mat(0x8b5e3c)),0,0.25*s,0));
 var c=ico(0.42*s,mat(blossom?0xffb7d5:0x58b368));c.position.y=0.75*s;g.add(c);
 var c2=ico(0.28*s,mat(blossom?0xff8fbf:0x6fca7f));c2.position.set(0.2*s,1.0*s,0.1*s);g.add(c2);
 g.position.set(x,0,z);return g;}
function buildGrove(l){var g=new THREE.Group();var s=0.9+l*0.15;
 g.add(elfTree(-0.45,0.2,s,l>=2));g.add(elfTree(0.45,-0.15,s*0.9,false));g.add(elfTree(0.05,0.5,s*0.7,l>=3));
 return g;}
function buildTower(l){var g=new THREE.Group();
 var h=1.2+l*0.4;
 g.add(put(cyl(0.32,0.42,h,6,mat(0xd9c9ff)),0,h/2,0));
 g.add(put(cyl(0.45,0.45,0.15,6,mat(0x8b7bc7)),0,h+0.07,0));
 var cr=octa(0.26+l*0.05,mat(0x00e5ff,0x00e5ff,0.8));cr.position.y=h+0.5;cr.userData.pulse=true;g.add(cr);
 if(l>=2){var ring=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.05,5,12),mat(0xffd23f,0x6b4e00,0.4));
  ring.rotation.x=Math.PI/2;ring.position.y=h*0.6;g.add(ring);}
 if(l>=3){var ring2=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.05,5,12),mat(0xffd23f,0x6b4e00,0.4));
  ring2.rotation.x=Math.PI/2;ring2.position.y=h*0.35;g.add(ring2);}
 return g;}
function buildMarket(l){var g=new THREE.Group();
 g.add(put(box(1.2,0.5,0.9,mat(0xc98f5a)),0,0.25,0));
 for(var i=0;i<4;i++){g.add(put(box(0.3,0.15,0.15,mat(0x8b5e3c)),-0.45+i*0.3,0.55,-0.3));}
 for(var j=0;j<5;j++){var slat=put(box(0.28,0.06,1.1,mat(j%2?0xff7bac:0xfffdf4)),-0.56+j*0.28,1.15,0);
  slat.rotation.x=-0.25;g.add(slat);}
 for(var p=0;p<2;p++){g.add(put(cyl(0.04,0.04,1.1,5,mat(0x8b5e3c)),p?0.62:-0.62,0.6,0.35));}
 g.add(put(box(0.35,0.3,0.35,mat(0x9be15d)),-0.35,0.7,0.1));
 g.add(put(box(0.3,0.25,0.3,mat(0xffb347)),0.3,0.68,-0.1));
 if(l>=2)g.add(put(box(0.5,0.7,0.5,mat(0xfff3d6)),0.75,0.35,0.3)); // прилавок+
 if(l>=3){var s=octa(0.14,mat(0xffd23f,0x6b4e00,0.5));s.position.set(0,1.6,0);g.add(s);}
 return g;}
function miniFlower(x,z,c1){var g=new THREE.Group();
 g.add(put(cyl(0.03,0.03,0.3,4,mat(0x2f7d3a)),0,0.15,0));
 var b=ico(0.11,mat(c1));b.position.y=0.34;g.add(b);
 g.position.set(x,0,z);return g;}
function buildGarden(l){var g=new THREE.Group();
 g.add(put(box(1.5,0.18,1.3,mat(0x7a5230)),0,0.09,0));
 var cols=[0xff7bac,0xffd23f,0xc07bff,0xff6b6b,0x7fd4ff,0x9be15d];
 for(var i=0;i<4+l*2;i++){var a=i/(4+l*2)*Math.PI*2;
  g.add(miniFlower(Math.cos(a)*0.5,Math.sin(a)*0.42,cols[i%cols.length]));}
 for(var f=0;f<4;f++){var a2=f/4*Math.PI*2+0.4;
  g.add(put(box(0.08,0.35,0.08,mat(0xfffdf4)),Math.cos(a2)*0.8,0.17,Math.sin(a2)*0.7));}
 if(l>=3){var pond=new THREE.Mesh(new THREE.CircleGeometry(0.3,10),mat(0x7fd4ff));
  pond.rotation.x=-Math.PI/2;pond.position.set(0,0.19,0);g.add(pond);}
 return g;}
function buildSpire(){var g=new THREE.Group(),l=3;
 g.add(put(cyl(0.5,0.65,0.4,8,mat(0xe8e2d0)),0,0.2,0));
 g.add(put(cyl(0.28,0.4,2.2,8,mat(0xffd23f,0x6b4e00,0.35)),0,1.5,0));
 for(var i=0;i<3;i++){var ring=new THREE.Mesh(new THREE.TorusGeometry(0.42+i*0.12,0.06,6,16),
  mat(0xff7bac,0x993355,0.4));ring.rotation.x=Math.PI/2;ring.position.y=0.9+i*0.5;g.add(ring);}
 var orb=octa(0.3,mat(0xffffff,0xffd23f,1));orb.position.y=2.9;orb.userData.pulse=true;g.add(orb);
 g.add(put(cone(0.15,0.4,6,mat(0xffd23f)),0,3.25,0));
 return g;}
var BUILDERS={house:buildHouse,grove:buildGrove,tower:buildTower,market:buildMarket,garden:buildGarden,spire:buildSpire};
function refreshCell(i){
 var old=bGroups[i];
 if(old){scene.remove(old);old.traverse(function(o){if(o.geometry)o.geometry.dispose();});delete bGroups[i];}
 var c=S.cells[i];if(!c)return;
 var xz=idx2xz(i);
 var g=BUILDERS[c.t](c.l);
 g.position.set(xz[0],0.3,xz[1]);
 g.userData.base=1.15;g.scale.set(0.01,0.01,0.01);
 g.userData.idx=i;
 scene.add(g);bGroups[i]=g;
 pops.push({g:g,t:0});}
function refreshAll(){for(var i=0;i<64;i++)refreshCell(i);}
function initThree(){
 if(typeof THREE==='undefined'){document.getElementById('toast').textContent='Нет соединения с CDN — 3D появится онлайн 🌲';return false;}
 scene=new THREE.Scene();
 scene.background=C(0xcdeffd);
 scene.fog=new THREE.Fog(0xcdeffd,26,60);
 camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,200);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.1;
 document.getElementById('scene').appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xeaf7ff,0x77b06f,0.9));
 var sun=new THREE.DirectionalLight(0xfff2d0,1.6);
 sun.position.set(10,16,8);sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 sun.shadow.camera.left=-12;sun.shadow.camera.right=12;
 sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;
 sun.shadow.camera.far=45;sun.shadow.bias=-0.0005;
 scene.add(sun);
 // остров-основа
 var base=new THREE.Mesh(new THREE.CylinderGeometry(11.5,10,1.2,24),mat(0x6fbf73));
 base.position.y=-0.75;base.receiveShadow=true;scene.add(base);
 var rim=new THREE.Mesh(new THREE.TorusGeometry(11.5,0.35,6,32),mat(0xfff3d6));
 rim.rotation.x=Math.PI/2;rim.position.y=-0.15;scene.add(rim);
 // клетки
 for(var i=0;i<64;i++){var xz=idx2xz(i);
  var r=Math.floor(i/N),c=i%N;
  var t=new THREE.Mesh(new THREE.BoxGeometry(TILE-0.12,0.3,TILE-0.12),
   mat(((r+c)%2)?0x8fd694:0x7ccf8a));
  t.position.set(xz[0],0.15,xz[1]);t.receiveShadow=true;
  t.userData.idx=i;scene.add(t);tileMeshes.push(t);}
 // декор вокруг: ёлки и камни детерминированно
 var seed=42;function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;}
 for(var d=0;d<16;d++){var a=d/16*Math.PI*2+rnd()*0.3,rr=12.5+rnd()*3;
  var tr=elfTree(Math.cos(a)*rr,Math.sin(a)*rr,1+rnd()*0.8,rnd()<0.3);
  tr.traverse(function(o){if(o.isMesh)o.castShadow=true;});scene.add(tr);}
 for(var s=0;s<7;s++){var a2=s/7*Math.PI*2+0.2,rr2=12+rnd()*3.5;
  var rock=ico(0.3+rnd()*0.4,mat(0xb9c4c9));rock.position.set(Math.cos(a2)*rr2,0.2,Math.sin(a2)*rr2);scene.add(rock);}
 // облака
 for(var cl=0;cl<5;cl++){var cg=new THREE.Group();
  for(var p=0;p<3;p++){var puff=ico(0.7+rnd()*0.5,mat(0xffffff));puff.position.set(p*0.9-0.9,rnd()*0.3,0);
   puff.castShadow=false;cg.add(puff);}
  cg.position.set(-14+rnd()*28,8+rnd()*3,-10+rnd()*16);
  cg.userData.speed=0.2+rnd()*0.3;scene.add(cg);clouds.push(cg);}
 raycaster=new THREE.Raycaster();mouseV=new THREE.Vector2();
 bindInput();updateCam();fit();
 window.addEventListener('resize',fit);
 return true;}
var clouds=[];
function fit(){if(!renderer)return;renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
function updateCam(){if(!camera)return;
 var sp=Math.sin(pitch),cp=Math.cos(pitch);
 camera.position.set(Math.sin(yaw)*dist*cp,sp*dist,Math.cos(yaw)*dist*cp);
 camera.lookAt(0,0.8,0);}
/* --- ввод: тап = строй/выбор, drag = вращение, колесо/pinch = зум --- */
function bindInput(){
 var el=renderer.domElement,downX=0,downY=0,downT=0,moved=0,dragging=false,pinchD=0;
 el.style.touchAction='none';
 el.addEventListener('pointerdown',function(e){dragging=true;moved=0;downX=e.clientX;downY=e.clientY;downT=Date.now();
  try{el.setPointerCapture(e.pointerId);}catch(_){}});
 el.addEventListener('pointermove',function(e){
  if(!dragging)return;
  var dx=e.clientX-downX,dy=e.clientY-downY;
  moved=Math.max(moved,Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY));
  if(moved>10){yaw-= (e.clientX-(el._px||e.clientX))*0.008;updateCam();}
  el._px=e.clientX;});
 el.addEventListener('pointerup',function(e){dragging=false;el._px=null;
  if(moved<10&&Date.now()-downT<600)tapAt(e.clientX,e.clientY);});
 el.addEventListener('wheel',function(e){e.preventDefault();dist=Math.min(30,Math.max(9,dist+e.deltaY*0.02));updateCam();},{passive:false});
 el.addEventListener('touchmove',function(e){
  if(e.touches.length===2){e.preventDefault();
   var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
   if(pinchD>0)dist=Math.min(30,Math.max(9,dist-(d-pinchD)*0.05)),updateCam();
   pinchD=d;}},{passive:false});
 el.addEventListener('touchend',function(){pinchD=0;});
 el.addEventListener('pointermove',function(e){hoverAt(e.clientX,e.clientY);});}
function pick(cx,cy){
 var r=renderer.domElement.getBoundingClientRect();
 mouseV.x=((cx-r.left)/r.width)*2-1;mouseV.y=-((cy-r.top)/r.height)*2+1;
 raycaster.setFromCamera(mouseV,camera);
 var hit=raycaster.intersectObjects(tileMeshes,false);
 return hit.length?hit[0].object.userData.idx:-1;}
function tapAt(cx,cy){var i=pick(cx,cy);if(i<0){closeInspector();return;}clickCell(i);blip(520);}
var lastHover=-1,hoverT=0;
function hoverAt(cx,cy){var n=Date.now();if(n-hoverT<60)return;hoverT=n;
 var i=pick(cx,cy);if(i===lastHover)return;
 if(lastHover>=0)tileMeshes[lastHover].material.emissive.setHex(0x000000);
 lastHover=i;
 if(i>=0){var ok=S.cells[i]?true:canPay(B[tool].cost);
  tileMeshes[i].material.emissive.setHex(ok?0x224422:0x551111);}
 renderer.domElement.style.cursor=i>=0?'pointer':'grab';}
/* --- игровые действия --- */
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.opacity=1;
 clearTimeout(e._t);e._t=setTimeout(function(){e.style.opacity=0;},2200);}
function worldToScreen(v){var p=v.clone().project(camera);
 return {x:(p.x+1)/2*innerWidth,y:(-p.y+1)/2*innerHeight};}
function floater(txt,wx,wy,wz){try{var s=worldToScreen(new THREE.Vector3(wx,wy,wz));
 var d=document.createElement('div');d.className='floater';d.textContent=txt;
 d.style.left=s.x+'px';d.style.top=s.y+'px';document.body.appendChild(d);
 requestAnimationFrame(function(){d.style.transform='translateY(-60px)';d.style.opacity=0;});
 setTimeout(function(){d.remove();},1200);}catch(e){}}
function clickCell(i){
 var c=S.cells[i];
 if(bulldoze){
  if(!c){toast('Тут пусто — сносить нечего 🌲');return;}
  var base=B[c.t].cost;for(var k in base)S[k]+=Math.floor(base[k]*c.l*0.5);
  toast(B[c.t].em+' снесён, половина ресурсов возвращена 🚫');blip(300);
  S.cells[i]=null;refreshCell(i);closeInspector();after();renderHUD();return;}
 if(!c){
  var b=B[tool];
  if(!canPay(b.cost)){toast('Не хватает: нужно '+fmtCost(b.cost)+' 💸');blip(200);return;}
  pay(b.cost);S.cells[i]={t:tool,l:1};
  var xz=idx2xz(i);floater(b.em+' построен!',xz[0],2.2,xz[1]);blip(620);
  toast(b.em+' '+b.n+' построен! '+b.desc+' 🏗️');
  refreshCell(i);after();renderHUD();return;}
 openInspector(i);}
function gather(){var g=10+S.pop;S.wood+=g;S.mana+=Math.floor(g/2);
 toast('🎁 Дар леса: +'+g+' 🌲 и +'+Math.floor(g/2)+' 💧');blip(700);save();renderHUD();}
function doReset(){if(confirm('Начать новый город?')){S=def();save();refreshAll();closeInspector();renderHUD();toast('🌱 Новый Эввград! Мы уже победили 🏆');}}
function after(){
 if(S.pop>=42&&!S.win){S.win=true;document.getElementById('win').style.display='flex';toast('🏆 42 ЖИТЕЛЯ! МЫ УЖЕ ПОБЕДИЛИ! 🏆');blip(880);}
 save();}
/* --- HUD --- */
function renderHUD(){
 document.getElementById('gold').textContent=Math.floor(S.gold);
 document.getElementById('mana').textContent=Math.floor(S.mana);
 document.getElementById('wood').textContent=Math.floor(S.wood);
 document.getElementById('pop').textContent=S.pop;
 document.getElementById('cap').textContent=cap();
 document.getElementById('popLine').textContent=S.pop+' жителей';
 if(S.win)document.getElementById('win').style.display='flex';
 var dock=document.getElementById('dock');dock.innerHTML='';
 GROUPS.forEach(function(gr){
  var btn=document.createElement('button');
  var hasTool=!bulldoze&&gr.items.indexOf(tool)>=0;
  btn.className='tool'+(hasTool?' active':'');
  btn.innerHTML='<span class="em">'+gr.em+'</span>'+gr.n+(hasTool?'<small>'+B[tool].em+' '+B[tool].n+'</small>':'<small>'+gr.items.length+' постройки</small>');
  btn.onclick=function(){blip(500);if(openGroup===gr.id){closeShop();}else{openShop(gr.id);}renderHUD();};
  dock.appendChild(btn);});
 var bz=document.createElement('button');
 bz.className='tool bulldoze'+(bulldoze?' active':'');
 bz.innerHTML='<span class="em">🚫</span>Снести<small>возврат 50%</small>';
 bz.onclick=function(){bulldoze=!bulldoze;closeInspector();closeShop();toast(bulldoze?'Режим сноса: тапни здание 🚫':'Режим стройки 🏗️');renderHUD();};
 dock.appendChild(bz);
 var rs=document.createElement('button');
 rs.className='tool';rs.innerHTML='<span class="em">🗑</span>Заново<small>новый город</small>';
 rs.onclick=doReset;dock.appendChild(rs);
 if(selIdx>=0)fillInspector();}
function openShop(gid){openGroup=gid;closeInspector();
 var gr=null;GROUPS.forEach(function(x){if(x.id===gid)gr=x;});if(!gr)return;
 document.getElementById('shopTitle').textContent=gr.em+' '+gr.n;
 var grid=document.getElementById('shopGrid');grid.innerHTML='';
 gr.items.forEach(function(k){var b=B[k];
  var card=document.createElement('div');card.className='shopCard';
  card.innerHTML='<span class="em">'+b.em+'</span><b>'+b.n+'</b><small>'+b.desc+'</small><div class="cost">'+fmtCost(b.cost)+'</div>';
  card.onclick=function(){tool=k;bulldoze=false;selIdx=-1;closeShop();blip(620);
   toast(b.em+' '+b.n+' выбран! Тапни клетку 👆');renderHUD();};
  grid.appendChild(card);});
 document.getElementById('shop').style.display='block';}
function closeShop(){openGroup=null;document.getElementById('shop').style.display='none';}
function openInspector(i){selIdx=i;var c=S.cells[i];if(!c){closeInspector();return;}
 document.getElementById('inspector').style.display='block';fillInspector();}
function closeInspector(){selIdx=-1;document.getElementById('inspector').style.display='none';}
function fillInspector(){var c=S.cells[selIdx];if(!c)return;var b=B[c.t];
 document.getElementById('inspName').textContent=b.em+' '+b.n;
 document.getElementById('inspStars').textContent='★★★'.slice(0,c.l)+'☆☆☆'.slice(0,3-c.l);
 var pr=[];if(b.prod){for(var k in b.prod)pr.push('+'+(b.prod[k]*c.l).toFixed(1)+' '+CEM[k]+'/с');}
 if(b.house)pr.push('+'+(b.house*c.l)+' 🧝 жилья');
 if(b.boost)pr.push('доход и рост ×'+(1+gardens()*0.2).toFixed(1));
 document.getElementById('inspDesc').textContent=b.desc;
 document.getElementById('inspProd').textContent=pr.join(' · ')||'—';
 var up=document.getElementById('upBtn');
 if(c.l>=3){up.textContent='MAX уровень 👑';up.disabled=true;}
 else{var uc=upCost(c);up.textContent='Улучшить: '+fmtCost(uc);up.disabled=!canPay(uc);}
 var xz=idx2xz(selIdx);floater('👆',xz[0],2.0,xz[1]);}
/* --- цикл --- */
var clockT=0;
function loop(){requestAnimationFrame(loop);
 var dt=Math.min(clockT? (Date.now()-clockT)/1000:0.016,0.1);clockT=Date.now();
 var t=Date.now()/1000;
 for(var ci=0;ci<clouds.length;ci++){clouds[ci].position.x+=clouds[ci].userData.speed*dt;
  if(clouds[ci].position.x>18)clouds[ci].position.x=-18;}
 scene.traverse(function(o){if(o.userData&&o.userData.pulse){var s=1+Math.sin(t*3)*0.12;o.scale.set(s,s,s);}});
 for(var p=pops.length-1;p>=0;p--){var a=pops[p];a.t+=dt*3;
  var bs=a.g.userData.base||1;
  if(a.t>=1){a.g.scale.set(bs,bs,bs);pops.splice(p,1);}
  else{var e=1-Math.pow(1-a.t,3);a.g.scale.set(e*bs,e*bs,e*bs);}}
 renderer.render(scene,camera);}
/* --- старт --- */
load();
document.getElementById('giftBtn').onclick=gather;
document.getElementById('closeInsp').onclick=closeInspector;
document.getElementById('upBtn').onclick=function(){var c=S.cells[selIdx];if(!c)return;
 if(c.l>=3)return;var uc=upCost(c);if(!canPay(uc)){toast('Нужно '+fmtCost(uc)+' 💸');return;}
 pay(uc);c.l++;blip(700);var xz=idx2xz(selIdx);floater('ур.'+c.l+' ✨',xz[0],2.4,xz[1]);
 refreshCell(selIdx);after();renderHUD();};
document.getElementById('demoBtn').onclick=function(){var i=selIdx;if(i<0)return;
 bulldoze=true;clickCell(i);bulldoze=false;renderHUD();};
if(initThree()){refreshAll();renderHUD();loop();
 setInterval(function(){var p=prod();S.gold+=p.gold;S.mana+=p.mana;S.wood+=p.wood;
  var c=cap(),g=gardens();
  if(S.pop<c&&Math.random()<0.25*(1+g*0.5)){S.pop++;
   if(S.pop>=42&&!S.win){S.win=true;document.getElementById('win').style.display='flex';toast('🏆 42 ЖИТЕЛЯ! МЫ УЖЕ ПОБЕДИЛИ! 🏆');}}
  S.lastSeen=Date.now();save();renderHUD();},1000);}
else{renderHUD();}
/* крючок для тестов */
window.__elf={get:function(){return S;},tool:function(){return tool;},build:function(t){tool=t;bulldoze=false;
 var i=S.cells.findIndex(function(c){return !c;});if(i>=0)clickCell(i);return i;},
 tiles:function(){return tileMeshes.length;}};
</script>
