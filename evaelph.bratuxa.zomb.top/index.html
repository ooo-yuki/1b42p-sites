<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧝 Эввград — 3D город эльфов!</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
:root{--cream:#fffdf4;--ink:#2f5d3a;--berry:#ff7bac;--leaf:#58b368;--gold:#ffd23f;--sky:#cdeffd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;color:var(--ink)}
#scene{position:fixed;inset:0}
#scene canvas{display:block}
/* верхняя панель */
#topbar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none;z-index:10}
#cityTag{pointer-events:auto;background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:8px 16px;
font-weight:bold;font-size:18px;box-shadow:0 4px 0 rgba(47,93,58,.35)}
#cityTag small{display:block;font-size:11px;font-weight:normal;opacity:.75}
#cityTag a{color:var(--ink);text-decoration:none;font-size:11px}
#resbar{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.res{background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:bold;font-size:14px;
box-shadow:0 3px 0 rgba(47,93,58,.3);white-space:nowrap}
.res b{color:#d63d6e}
/* док стройки */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;display:flex;gap:8px;align-items:stretch;
background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:10px 12px;z-index:10;max-width:96vw;overflow-x:auto;
box-shadow:0 6px 0 rgba(47,93,58,.35)}
.tool{flex:0 0 auto;border:3px solid transparent;background:#f3f9ec;border-radius:16px;padding:8px 10px;min-width:76px;cursor:pointer;
text-align:center;font-size:12px;font-weight:bold;color:var(--ink);box-shadow:0 3px 0 rgba(47,93,58,.25);transition:transform .08s}
.tool:active{transform:translateY(2px);box-shadow:none}
.tool .em{font-size:26px;display:block}
.tool small{display:block;font-weight:normal;font-size:10px;opacity:.8}
.tool.active{border-color:var(--berry);background:#ffe9f2}
.tool.cant{opacity:.55}
.tool.bulldoze{background:#ffe3e3}
/* инспектор */
#inspector{position:fixed;right:10px;top:76px;width:230px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;
padding:14px;z-index:10;display:none;box-shadow:0 6px 0 rgba(47,93,58,.35)}
#inspector h3{margin:0 0 4px;font-size:18px}
#inspector .stars{color:#e8a100;font-size:15px;letter-spacing:2px}
#inspector p{font-size:13px;margin:6px 0}
#inspector button{width:100%;margin-top:6px;border:none;border-radius:14px;padding:10px;font-weight:bold;font-size:14px;cursor:pointer}
#upBtn{background:var(--gold);color:#5d4a00;box-shadow:0 3px 0 #b98f00}
#upBtn:active{transform:translateY(2px);box-shadow:none}
#upBtn:disabled{opacity:.45}
#demoBtn{background:#ffd9d9;color:#a33;box-shadow:0 3px 0 #c88}
#closeInsp{background:#eef5e6;color:var(--ink);box-shadow:0 3px 0 rgba(47,93,58,.3)}
#enterBtn{background:#dff5ff;color:#1c5d7a;box-shadow:0 3px 0 #7fb6cc}
#fpUI{display:none;position:fixed;inset:0;z-index:15;pointer-events:none}
#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;color:#fff;text-shadow:0 0 4px #000}
#exitFp{position:absolute;top:10px;right:10px;pointer-events:auto;border:3px solid var(--ink);background:var(--cream);
color:var(--ink);font-weight:bold;font-size:15px;border-radius:999px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(47,93,58,.35)}
#fpHint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:rgba(0,0,0,.55);color:#fff;
font-size:13px;padding:8px 16px;border-radius:999px;white-space:nowrap;max-width:94vw}
#talkBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:62px;pointer-events:auto;display:none;
border:3px solid var(--ink);background:var(--gold);color:#5d4a00;font-weight:bold;font-size:15px;
border-radius:999px;padding:12px 22px;cursor:pointer;box-shadow:0 4px 0 #b98f00}
#glockBtn{position:absolute;right:12px;bottom:120px;pointer-events:auto;
border:3px solid var(--ink);background:#3a3f4a;color:#fff;font-weight:bold;font-size:15px;
border-radius:999px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #111}
#fireBtn{position:absolute;right:12px;bottom:180px;pointer-events:auto;display:none;
border:3px solid var(--ink);background:#c00040;color:#fff;font-weight:bold;font-size:16px;
border-radius:50%;width:72px;height:72px;cursor:pointer;box-shadow:0 4px 0 #7a0028}
#jumpBtn{position:absolute;right:12px;bottom:262px;pointer-events:auto;display:none;
border:3px solid var(--ink);background:var(--cream);color:var(--ink);font-weight:bold;font-size:24px;
border-radius:50%;width:72px;height:72px;cursor:pointer;box-shadow:0 4px 0 rgba(47,93,58,.35)}
#jumpBtn:active{transform:scale(.92)}
#npcBubble{position:absolute;left:50%;transform:translateX(-50%);bottom:118px;pointer-events:none;display:none;
background:var(--cream);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;max-width:88vw;
font-size:14px;font-weight:bold;color:var(--ink);box-shadow:0 4px 0 rgba(47,93,58,.35);text-align:center}
#runBtn{position:absolute;left:12px;bottom:120px;pointer-events:auto;display:none;
border:3px solid var(--ink);background:#7fd4ff;color:#1c5d7a;font-weight:bold;font-size:15px;
border-radius:999px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #4a8aaa}
#surf{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(20,30,25,.85)}
#surfBox{width:min(96vw,430px);background:var(--cream);border:4px solid var(--gold);border-radius:22px;padding:12px;text-align:center;box-shadow:0 0 30px var(--gold)}
#surfCv{width:100%;height:380px;border-radius:14px;background:#1c2b24;display:block;touch-action:none}
#surfHud{font-weight:bold;font-size:14px;margin:6px 0}
#surfBtns{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
#surfBtns button{border:3px solid var(--ink);border-radius:12px;padding:10px 14px;font-weight:bold;font-size:16px;cursor:pointer;background:#eef5e6;color:var(--ink)}
#surfQuit{background:#ffd9d9 !important}
#joy{position:absolute;left:18px;bottom:60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);
border:2px solid rgba(255,255,255,.5);display:none}
#stick{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55);
transform:translate(-50%,-50%)}
/* тост */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:108px;background:var(--ink);color:#fff;font-size:14px;font-weight:bold;
padding:10px 20px;border-radius:999px;z-index:10;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center}
/* кнопка дара леса */
#giftBtn{position:fixed;right:12px;bottom:108px;z-index:10;border:3px solid var(--ink);background:var(--berry);color:#fff;
font-weight:bold;font-size:15px;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #a33e66}
#giftBtn:active{transform:translateY(2px);box-shadow:none}
#ticketBtn{position:fixed;left:12px;bottom:108px;z-index:10;border:3px solid var(--ink);background:var(--gold);color:#5d4a00;
font-weight:bold;font-size:15px;border-radius:999px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 #b98f00}
#ticketBtn:active{transform:translateY(2px);box-shadow:none}
#ticketBtn:disabled{opacity:.5}
/* магазин (шторка над доком) */
#shop{position:fixed;left:50%;transform:translateX(-50%);bottom:112px;z-index:11;display:none;
background:var(--cream);border:3px solid var(--ink);border-radius:22px;padding:12px;max-width:96vw;width:470px;
max-height:min(62vh,520px);overflow:hidden;
box-shadow:0 8px 0 rgba(47,93,58,.35)}
#shop h4{margin:0 0 8px;font-size:17px;flex:0 0 auto}
#shopGrid{display:flex;gap:10px;flex-wrap:wrap;overflow-y:auto;overflow-x:hidden;
max-height:calc(min(62vh,520px) - 52px);padding:2px 2px 6px;-webkit-overflow-scrolling:touch;touch-action:pan-y;
scrollbar-width:thin;scrollbar-color:var(--leaf) #eef5e6}
#shopGrid::-webkit-scrollbar{width:8px}
#shopGrid::-webkit-scrollbar-thumb{background:var(--leaf);border-radius:8px}
#shopGrid::-webkit-scrollbar-track{background:#eef5e6;border-radius:8px}
.shopCard{flex:1 1 40%;border:3px solid var(--ink);border-radius:18px;background:#f3f9ec;padding:12px 8px;cursor:pointer;
text-align:center;color:var(--ink);box-shadow:0 3px 0 rgba(47,93,58,.25)}
.shopCard:active{transform:scale(.95)}
.shopCard .em{font-size:48px;display:block}
.shopCard b{font-size:15px}
.shopCard small{display:block;font-size:12px;margin-top:4px;min-height:30px}
.shopCard .cost{color:#d63d6e;font-weight:bold;font-size:13px;margin-top:6px}
@media(max-width:640px){#shop{bottom:172px;max-height:44vh}#shopGrid{max-height:calc(44vh - 52px)}}
/* победа */
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(47,93,58,.45);z-index:20}
#winBox{background:var(--cream);border:4px solid var(--gold);border-radius:26px;padding:28px;max-width:340px;text-align:center;
box-shadow:0 0 40px var(--gold);font-size:17px}
#winBox button{margin-top:12px;background:var(--gold);border:none;border-radius:14px;padding:10px 26px;font-weight:bold;font-size:16px;cursor:pointer;color:#5d4a00}
/* всплывающие +N */
.floater{position:fixed;z-index:9;font-weight:bold;font-size:16px;color:#d63d6e;pointer-events:none;text-shadow:0 2px 0 #fff;
transition:transform 1.1s ease-out,opacity 1.1s}
@media(max-width:640px){
 #cityTag{font-size:14px;padding:6px 10px}
 .res{font-size:12px;padding:5px 9px}
 #inspector{top:auto;bottom:108px;right:8px;left:8px;width:auto}
 #giftBtn{bottom:170px;font-size:13px;padding:10px 14px}
 #ticketBtn{bottom:170px;font-size:13px;padding:10px 14px;left:8px}
 #toast{bottom:170px}
 .tool{min-width:66px}
}
</style>
</head>
<body>
<div id="scene"></div>
<div id="topbar">
 <div id="cityTag">🧝 Эввград <small><span id="popLine">0 жителей</span> · <a href="https://hub.bratuxa.zomb.top">← Хаб 1Б42П</a></small></div>
 <div id="resbar">
  <div class="res">🪙 <b id="gold">0</b></div>
  <div class="res">💧 <b id="mana">0</b></div>
  <div class="res">🌲 <b id="wood">0</b></div>
  <div class="res">🧝 <b id="pop">0</b>/<b id="cap">0</b></div>
 </div>
</div>
<div id="shop"><h4 id="shopTitle"></h4><div id="shopGrid"></div></div>
<div id="dock"></div>
<div id="inspector">
 <h3 id="inspName">🏠</h3>
 <div class="stars" id="inspStars">★☆☆</div>
 <p id="inspDesc"></p>
 <p id="inspProd"></p>
 <button id="upBtn">Улучшить</button>
 <button id="demoBtn">Снести</button>
 <button id="enterBtn">🚪 Зайти внутрь</button>
 <button id="closeInsp">Закрыть</button>
</div>
<div id="toast"></div>
<div id="fpUI">
 <div id="cross" style="display:none">+</div>
 <button id="exitFp">🚪 Выйти</button>
 <div id="npcBubble"></div>
 <button id="talkBtn">💬 Поговорить (E)</button>
 <button id="glockBtn">🔫 Глок (G)</button>
 <button id="fireBtn">🔥</button>
 <button id="jumpBtn">⬆️</button>
 <button id="runBtn">🏃 Бежать!</button>
 <div id="fpHint">WASD — ходить · мышь — осмотр · ESC — выйти</div>
 <div id="joy"><div id="stick"></div></div>
</div>
<div id="surf"><div id="surfBox">🏃 <b>ПОБЕГ ОТ КОПА!</b> 🏃<br><small>Держись 42 сек! ← → дорожки · ↑ прыжок · ↓ кувырок</small>
<canvas id="surfCv" width="390" height="380"></canvas><div id="surfHud"></div>
<div id="surfBtns"><button id="surfL">⬅️</button><button id="surfU">⬆️</button><button id="surfD">⬇️</button><button id="surfR">➡️</button><button id="surfQuit">🏳️ Сдаться</button></div></div></div>
<button id="ticketBtn">🎟️ Билет 50🪙</button>
<button id="giftBtn">🎁 Дар леса</button>
<div id="win"><div id="winBox">🏆 <b>МЫ УЖЕ ПОБЕДИЛИ!</b> 🏆<br>Эввград достиг 42 жителей! Город сияет, лес поёт! 🧝🌲✨<br><button onclick="document.getElementById('win').style.display='none'">Ура! 🎉</button></div></div>
<script>
/* ================= ЭКОНОМИКА (сейвы совместимы со старой версией) ================= */
var KEY='elfograd42_v1';
var B={
 house:{em:'🏠',n:'Дом эльфа',cost:{gold:50,wood:20},house:4,desc:'Минимализм: свет, дерево и панорамные окна'},
 grove:{em:'🌲',n:'Роща',cost:{gold:30},prod:{wood:0.4},desc:'Выращивает дерево'},
 tower:{em:'🔮',n:'Башня маны',cost:{gold:80,wood:40},prod:{mana:0.3},desc:'Собирает ману'},
 market:{em:'🏪',n:'Рынок',cost:{gold:60,wood:30},prod:{gold:0.5},desc:'Торгует и даёт золото'},
 garden:{em:'🌸',n:'Сад',cost:{mana:40,wood:20},boost:1,desc:'Ускоряет весь доход и рост'},
 spire:{em:'🗼',n:'Шпиль 42',cost:{gold:300,wood:150,mana:100},prod:{gold:2,mana:1,wood:1},house:10,desc:'Венец города!'},
 tavern:{em:'🍺',n:'Таверна',cost:{gold:70,wood:40},prod:{gold:0.3},desc:'Эль течёт, город растёт'},
 treasury:{em:'🏦',n:'Казна',cost:{gold:150,wood:80},prod:{gold:1},desc:'Золото к золоту'},
 sawmill:{em:'🪵',n:'Лесопилка',cost:{gold:100,wood:30},prod:{wood:0.8},desc:'Брёвна рекой'},
 glade:{em:'🦋',n:'Поляна фей',cost:{wood:60,mana:20},prod:{mana:0.2},desc:'Феи ускоряют рост'},
 runes:{em:'🗿',n:'Рунический круг',cost:{gold:120,wood:60},prod:{mana:0.6},desc:'Камни шепчут ману'},
 portal:{em:'🌀',n:'Портал 42',cost:{gold:250,mana:150,wood:100},prod:{gold:1,mana:0.5,wood:0.5},house:6,desc:'Мини-Шпиль: всё сразу'},
 mall:{em:'🏬',n:'Торговый центр',cost:{gold:200,wood:120},prod:{gold:1.5},desc:'Шопинг нон-стоп'},
 cinema:{em:'🎬',n:'Кинотеатр',cost:{gold:180,wood:100,mana:40},prod:{gold:1.2},desc:'Кино манит жителей'},
 theatre:{em:'🎭',n:'Театр',cost:{gold:160,wood:90,mana:60},desc:'Культура притягивает'},
 ferris:{em:'🎡',n:'Колесо обозрения',cost:{gold:350,wood:200,mana:120},prod:{gold:2.5},house:4,desc:'Главная радость города'},
 beach:{em:'🏖️',n:'Платный пляж',cost:{gold:250,wood:150},prod:{gold:2},desc:'Вход платный — касса довольна'},
 shop:{em:'🛒',n:'Магазин',cost:{gold:90,wood:50},prod:{gold:0.7},desc:'Продукты рядом с домом'},
 barber:{em:'💈',n:'Парикмахерская',cost:{gold:110,wood:60,mana:20},prod:{gold:0.5},desc:'Красота притягивает'},
 hospital:{em:'🏥',n:'Больница',cost:{gold:220,wood:120,mana:60},prod:{gold:0.4},desc:'Здоровый город растёт'},
 admin:{em:'🏛️',n:'Администрация',cost:{gold:400,wood:250,mana:150},prod:{gold:2,mana:1},house:8,desc:'Мэрия: налоги и порядок'},
 park:{em:'🎢',n:'Парк развлечений',cost:{gold:300,wood:180,mana:60},prod:{gold:2.2},desc:'Карусели манят жителей'},
 airport:{em:'✈️',n:'Аэропорт',cost:{gold:500,wood:300,mana:200},prod:{gold:3,mana:1},house:6,desc:'Ворота в небо'},
 railway:{em:'🚂',n:'ЖД вокзал',cost:{gold:280,wood:200},prod:{gold:1.5},desc:'Поезда везут жителей'},
 bus:{em:'🚌',n:'Автовокзал',cost:{gold:150,wood:100},prod:{gold:0.9},desc:'Автобусы со всех сторон'},
 stadium:{em:'🏟️',n:'Стадион',cost:{gold:450,wood:250,mana:150},prod:{gold:2.8},house:4,desc:'Болельщики переезжают'},
 refinery:{em:'🛢️',n:'НПЗ',cost:{gold:350,wood:200,mana:100},prod:{gold:3},desc:'Нефтедоллары текут'}
};
var ORDER=['house','grove','tower','market','garden','spire'];
var S,tool='house',bulldoze=false,selIdx=-1,openGroup=null;
/* разделы магазина (как в Clash of Clans): внизу только группы */
var GROUPS=[
 {id:'city',em:'🏠',n:'Город',items:['house','market','tavern','treasury','shop','admin','airport','railway','bus','refinery']},
 {id:'nature',em:'🌲',n:'Природа',items:['grove','garden','sawmill','glade']},
 {id:'magic',em:'🔮',n:'Магия',items:['tower','runes','portal','spire']},
 {id:'fun',em:'🎭',n:'Развлечения',items:['mall','cinema','theatre','ferris','beach','barber','hospital','park','stadium']}
];
var ticketCd=0;
function def(){return{gold:120,mana:20,wood:60,pop:0,cells:Array(256).fill(null),lastSeen:Date.now(),win:false};}
function validCell(c){return c&&typeof c.t==='string'&&B[c.t]&&(c.l===1||c.l===2||c.l===3);}
function load(){var d=def(),raw=null;try{raw=JSON.parse(localStorage.getItem(KEY));}catch(e){raw=null;}
 S=d;
 if(raw&&typeof raw==='object'){
  for(var k in d)if(k!=='cells'&&typeof raw[k]==='number')S[k]=raw[k];
  if(typeof raw.win==='boolean')S.win=raw.win;
  if(raw.cells&&raw.cells.length===64){var big=Array(256).fill(null);
   for(var mr=0;mr<8;mr++)for(var mc=0;mc<8;mc++){var oc=raw.cells[mr*8+mc];big[(mr+4)*16+(mc+4)]=validCell(oc)?{t:oc.t,l:oc.l}:null;}
   S.cells=big;setTimeout(function(){toast('🗺️ Город расширен до 16×16! Старый центр на месте 🏙️');},800);}
  else if(raw.cells&&raw.cells.length){var lim=Math.min(raw.cells.length,256);
   for(var ci=0;ci<lim;ci++){var cc=raw.cells[ci];if(validCell(cc))S.cells[ci]={t:cc.t,l:cc.l};}}}
 var pvoRef={gold:0,wood:0,mana:0},hadPvo=false;
 S.cells.forEach(function(c,i){if(c&&c.t==='pvo'){var b0={gold:200,wood:100,mana:80};
  for(var k in b0)pvoRef[k]+=Math.floor(b0[k]*c.l*0.5);S.cells[i]=null;hadPvo=true;}});
 if(hadPvo){for(var k in pvoRef)S[k]+=pvoRef[k];
  setTimeout(function(){toast('🚀 ПВО демонтировано, половина ресурсов возвращена');},800);}
 var now=Date.now(),dt=Math.min((now-(S.lastSeen||now))/1000,8*3600);
 if(dt>30){var g=prod().gold*dt;if(g>0){S.gold+=Math.floor(g);setTimeout(function(){toast('🌙 Пока тебя не было: +'+Math.floor(g)+' 🪙');},800);}}
 S.lastSeen=now;save();}
function save(){S.lastSeen=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function lvlMult(l){return l;}
function gardens(){return S.cells.filter(function(c){return c&&c.t==='garden';}).length;}
function prod(){var p={gold:0,mana:0,wood:0};
 S.cells.forEach(function(c){if(!c)return;var b=B[c.t],m=lvlMult(c.l);
  if(b.prod){for(var k in b.prod)p[k]+=b.prod[k]*m;}});
 var g=gardens();if(g>0){p.gold*=(1+g*0.2);p.mana*=(1+g*0.2);p.wood*=(1+g*0.2);}
 return p;}
function cap(){var c=0;S.cells.forEach(function(x){if(x&&B[x.t].house)c+=B[x.t].house*lvlMult(x.l);});return c;}
function canPay(cost){for(var k in cost)if((S[k]||0)<cost[k])return false;return true;}
function pay(cost){for(var k in cost)S[k]-=cost[k];}
function upCost(c){var base=B[c.t].cost,r={};for(var k in base)r[k]=Math.floor(base[k]*1.8*c.l);return r;}
var CEM={gold:'🪙',mana:'💧',wood:'🌲'};

function refreshCell(i){
 var c0=S.cells[i];
 var old=bGroups[i];
 if(old){scene.remove(old);old.traverse(function(o){if(o.geometry)o.geometry.dispose();});delete bGroups[i];}
 if(!c0)return;
 if(!BUILDERS[c0.t])return; // неизвестный тип: сейв НЕ трогаем, просто не рисуем
 var c=S.cells[i];if(!c)return;
 var xz=idx2xz(i);
 var g=BUILDERS[c.t](c.l);
 g.position.set(xz[0],0.3,xz[1]);
 g.userData.base=1.15;g.scale.set(0.01,0.01,0.01);
 g.userData.idx=i;
 scene.add(g);bGroups[i]=g;
 pops.push({g:g,t:0});}

 function tick(now){if(!surfOn||!surf||surf.over)return;

function surfEnd(win){if(!surf||surf.over)return;surf.over=true;surfOn=false;

function surfTick(dt,cv){var s=surf,W=cv.width,H=cv.height,g=cv.getContext('2d');
 s.speed=Math.min(430,s.speed+dt*9);s.dist+=s.speed*dt/10;s.copD=Math.max(0,s.copD-dt*0.55);
 if(s.inv>0)s.inv-=dt;if(s.duck>0)s.duck-=dt;
 if(s.py>0||s.vy!==0){s.vy-=1100*dt;s.py+=s.vy*dt;if(s.py<=0){s.py=0;s.vy=0;}}
 s.spawnT-=dt;
 if(s.spawnT<=0){s.spawnT=Math.max(0.42,0.95-s.dist/900);
  var spawnLane=Math.floor(Math.random()*3),r=Math.random();
  if(r<0.62)s.obs.push({lane:spawnLane,y:-30,kind:Math.random()<0.45?'high':'low'});
  else if(r<0.8)s.obs.push({lane:spawnLane,y:-30,kind:'full'});
  else{var l2=(spawnLane+1+Math.floor(Math.random()*2))%3;
   s.obs.push({lane:spawnLane,y:-30,kind:'low'});s.obs.push({lane:l2,y:-30,kind:'low'});}}
 s.coinT-=dt;
 if(s.coinT<=0){s.coinT=0.7+Math.random()*0.8;s.coins.push({lane:Math.floor(Math.random()*3),y:-20});}
 var px=surfLaneX(s.lane,W),pw=44,ph=s.duck>0?30:52,pyBase=H-70;
 var pTop=pyBase-ph-s.py*0.35;
 for(var i=s.obs.length-1;i>=0;i--){var o=s.obs[i];o.y+=s.speed*dt;
  if(o.y>H+40){s.obs.splice(i,1);continue;}
  var ox=surfLaneX(o.lane,W),ow=46,oh=o.kind==='full'?120:(o.kind==='high'?44:52);
  var oTop=o.y-oh;
  var overlapX=Math.abs(px-ox)<(pw+ow)/2-8;
  var overlapY=(pTop<o.y-4)&&(pyBase-s.py*0.1>oTop+8);
  var mustDuck=o.kind==='high',mustJump=o.kind==='low';
  var dodged=(mustDuck&&s.duck>0)||(mustJump&&s.py>60);
  if(overlapX&&overlapY&&!dodged&&s.inv<=0){s.lives--;s.inv=1.2;s.copD=Math.max(0,s.copD-4);
   blip(180);if(s.lives<0){surfDraw(g,s,W,H,px,pyBase);surfEnd(false);return;}}}
 for(var ci=s.coins.length-1;ci>=0;ci--){var c=s.coins[ci];c.y+=s.speed*dt;
  if(c.y>H+30){s.coins.splice(ci,1);continue;}
  var cx=surfLaneX(c.lane,W);
  if(Math.abs(px-cx)<34&&Math.abs((pyBase-26-s.py*0.35)-c.y)<36){s.coins.splice(ci,1);
   S.gold+=2;save();s.copD=Math.min(10,s.copD+0.4);blip(760);}}
 if(s.copD<=0){surfDraw(g,s,W,H,px,pyBase);surfEnd(false);return;}
 if(s.dist>=s.goal){surfDraw(g,s,W,H,px,pyBase);surfEnd(true);renderHUD();return;}
 renderHUD();surfDraw(g,s,W,H,px,pyBase);}
function surfDraw(g,s,W,H,px,pyBase){g.clearRect(0,0,W,H);
 var bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#2f5d3a');bg.addColorStop(1,'#1c2b24');

  if(o.kind==='full'){g.fillStyle='#3a3f4a';g.fillRect(ox-23,o.y-120,46,120);

 var copY=pyBase+34+s.copD*7;
 g.font='30px serif';g.textAlign='center';g.fillText('👮',px,copY);

 if(!blink){var ph2=s.duck>0?30:52;

    if(npc.scammer&&!npc.down&&Date.now()>scamCd&&Math.random()<0.008&&Math.floor(S.gold)>0){
     var st2=Math.min(Math.floor(S.gold),3+Math.floor(Math.random()*5));S.gold-=st2;save();renderHUD();scamCd=Date.now()+5000;
     showBubble(npc.name,'Карман-то дырявый! -'+st2+'🪙 😈');toast('😈 Карманник '+npc.name+' увёл '+st2+'🪙!');blip(200);}}}
  for(var si=fpShots.length-1;si>=0;si--){var sh=fpShots[si];
   sh.m.position.x+=sh.vx*dt;sh.m.position.y+=sh.vy*dt;sh.m.position.z+=sh.vz*dt;
   sh.vy-=4*dt;sh.life-=dt;var hit=null;
   for(var hi=0;hi<fpNPCs.length;hi++){var hn=fpNPCs[hi];if(hn.down)continue;
    var hx=sh.m.position.x-(FPX+hn.g.position.x),hz=sh.m.position.z-hn.g.position.z,hy=sh.m.position.y-(hn.g.position.y+0.9);
    if(hx*hx+hz*hz<0.45&&Math.abs(hy)<1.2){hit=hn;break;}}
   if(hit){if(hit.cop){curIn.remove(sh.m);fpShots.splice(si,1);
    wanted+=2;showBubble(hit.name,'Нападение на полицию?! Розыск '+wanted+'! 🚨');toast('🚨 Розыск '+wanted+'! Коп не падает!');
    blip(200);continue;}
    hit.down=true;hit.resp=5;hit.wt=0;wanted+=1;
    spawnBlood(FPX+hit.g.position.x,1.3,hit.g.position.z);
    showBubble(hit.name,'Ай! Парень, ты чего?! 🩸');
    floater('🩸 бах! 🚨+1',FPX+hit.g.position.x,2.4,hit.g.position.z);
    var gk2=['gold','mana','wood'][Math.floor(Math.random()*3)];S[gk2]+=5;save();renderHUD();
    floater('+5 '+(gk2==='gold'?'🪙':gk2==='mana'?'💧':'🌲'),FPX+hit.g.position.x,2.0,hit.g.position.z);
    toast('🎯 '+hit.name+' прилёг отдохнуть... +5 тебе за меткость!');
    curIn.remove(sh.m);fpShots.splice(si,1);continue;}
   if(sh.life<=0||sh.m.position.y<0){curIn.remove(sh.m);fpShots.splice(si,1);}}
  for(var bi=fpBlood.length-1;bi>=0;bi--){var bl=fpBlood[bi];bl.life-=dt;
   if(bl.flat){bl.m.material.opacity=Math.min(0.85,bl.life/2);
    if(bl.life<=0){curIn.remove(bl.m);fpBlood.splice(bi,1);}continue;}
   bl.m.position.x+=bl.vx*dt;bl.m.position.y+=bl.vy*dt;bl.m.position.z+=bl.vz*dt;
   bl.vy-=9*dt;if(bl.m.position.y<0.04){bl.m.position.y=0.04;bl.vy*=-0.3;bl.vx*=0.7;bl.vz*=0.7;}
   bl.m.material.opacity=Math.min(1,bl.life*1.6);
   if(bl.life<=0){curIn.remove(bl.m);fpBlood.splice(bi,1);}}
  var cd=4.2,cp=Math.max(-0.15,Math.min(1.1,fpPitch));
  var cc=Math.cos(cp),ss2=Math.sin(cp);
  camera.position.set(FPX+fpPos.x+sy*cc*cd,2.1+ss2*cd,fpPos.z+cy*cc*cd);
  camera.lookAt(FPX+fpPos.x,1.15+avY*0.5,fpPos.z);
  if(fpType==='prison'){jailT-=dt;
   document.getElementById('fpHint').textContent='🚨 ТЮРЬМА 42: осталось '+Math.ceil(jailT)+'с...';
   document.getElementById('talkBtn').style.display='none';
   document.getElementById('fireBtn').style.display='none';
   if(jailT<=0){toast('Свобода! Больше не балуй! 🏆');exitBuilding();}}
  else if(wanted>0){document.getElementById('fpHint').textContent='🚨 РОЗЫСК '+wanted+': коп идёт! Жми 🏃 или убегай!';
   var rb=document.getElementById('runBtn');if(rb&&!surfOn)rb.style.display='block';}
  else{var rb2=document.getElementById('runBtn');if(rb2)rb2.style.display='none';}
  var near=nearestBratuha(),tb=document.getElementById('talkBtn');
  if(fpType!=='prison'){if(tb)tb.style.display=near?'block':'none';
   if(tb&&near)tb.textContent='💬 '+near.name+' (E)';}}
 renderer.render(scene,camera);}
/* --- старт --- */
load();
document.getElementById('giftBtn').onclick=gather;
document.getElementById('ticketBtn').onclick=buyTicket;
document.getElementById('closeInsp').onclick=closeInspector;
document.getElementById('upBtn').onclick=function(){var c=S.cells[selIdx];if(!c)return;
 if(c.l>=3)return;var uc=upCost(c);if(!canPay(uc)){toast('Нужно '+fmtCost(uc)+' 💸');return;}
 pay(uc);c.l++;blip(700);var xz=idx2xz(selIdx);floater('ур.'+c.l+' ✨',xz[0],2.4,xz[1]);
 refreshCell(selIdx);after();renderHUD();};
document.getElementById('demoBtn').onclick=function(){var i=selIdx;if(i<0)return;
 bulldoze=true;clickCell(i);bulldoze=false;renderHUD();};
document.getElementById('enterBtn').onclick=function(){if(selIdx>=0)enterBuilding(selIdx);};
document.getElementById('exitFp').onclick=exitBuilding;
document.getElementById('talkBtn').onclick=function(){talkToBratuha();};
document.getElementById('glockBtn').onclick=function(){toggleGlock();};
document.getElementById('fireBtn').onclick=function(){shootGlock();};
document.getElementById('jumpBtn').onclick=function(){jumpQueued=true;};
document.getElementById('runBtn').onclick=function(){startSurfEscape();};
document.getElementById('surfL').onclick=function(){surfMove(-1);};
document.getElementById('surfR').onclick=function(){surfMove(1);};
document.getElementById('surfU').onclick=function(){surfJump();};
document.getElementById('surfD').onclick=function(){surfDuck();};
document.getElementById('surfQuit').onclick=function(){surfEnd(false);};
(function(){var cv=document.getElementById('surfCv'),sx=0,sy2=0;
 cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy2=e.clientY;});
 cv.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy2;
  if(Math.abs(dx)<24&&Math.abs(dy)<24){surfJump();return;}
  if(Math.abs(dx)>Math.abs(dy)){surfMove(dx>0?1:-1);}else{if(dy<0)surfJump();else surfDuck();}});})();
if(initThree()){refreshAll();renderHUD();loop();
 setInterval(function(){var p=prod();S.gold+=p.gold;S.mana+=p.mana;S.wood+=p.wood;
  var c=cap(),g=gardens();
  if(S.pop<c&&Math.random()<0.25*(1+g*0.5)*(1+countT('tavern')*0.5+countT('glade')*0.25+countT('theatre')*0.4+countT('cinema')*0.3+countT('barber')*0.2+countT('hospital')*0.6+countT('park')*0.3+countT('railway')*0.4+countT('bus')*0.3+countT('stadium')*0.5)){S.pop++;
   if(S.pop>=42&&!S.win){S.win=true;document.getElementById('win').style.display='flex';toast('🏆 42 ЖИТЕЛЯ! МЫ УЖЕ ПОБЕДИЛИ! 🏆');}}
  S.lastSeen=Date.now();save();renderHUD();},1000);}
else{renderHUD();}
/* крючок для тестов */
window.__elf={get:function(){return S;},tool:function(){return tool;},build:function(t){tool=t;bulldoze=false;
 var i=S.cells.findIndex(function(c){return !c;});if(i>=0)clickCell(i);return i;},
 tiles:function(){return tileMeshes.length;},
 enter:function(i){enterBuilding(i);},exit:function(){exitBuilding();},
 npcs:function(){return fpNPCs.map(function(n){return {name:n.name,x:Math.round(n.g.position.x*100)/100,z:Math.round(n.g.position.z*100)/100};});},
 near:function(){var n=nearestBratuha();return n?n.name:null;},
 talk:function(){talkToBratuha();return document.getElementById('npcBubble').textContent;},
 glock:function(){toggleGlock();return glockOut;},
 fire:function(){shootGlock();return fpShots.length;},
 crime:function(){return {wanted:wanted,jail:Math.ceil(jailT),type:fpType};},
 surf:function(){startSurfEscape();return surfOn;},
 surfState:function(){return surf?{on:surfOn,dist:Math.floor(surf.dist),lives:surf.lives,copD:Math.round(surf.copD*10)/10}:{on:surfOn};},
 surfWin:function(){surfEnd(true);return wanted;},
 fp:function(){return {mode:fpMode,type:fpType,x:Math.round(fpPos.x*100)/100,z:Math.round(fpPos.z*100)/100};}};
</script>
