<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Трекер онлайна 1Б42П 📡</title>
<style>
body{font-family:system-ui,sans-serif;background:#1c2b1e;color:#f5f0dc;margin:0;padding:16px}
h1{color:#ffd23f}
.cards{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.card{background:#2f5d3a;border-radius:14px;padding:12px 16px;min-width:140px}
.card b{font-size:26px;color:#ffd23f}
.card small{display:block;opacity:.8}
table{border-collapse:collapse;margin:12px 0;background:#243b28;border-radius:10px;overflow:hidden}
td,th{padding:8px 14px;border-bottom:1px solid #3a5a40;text-align:left}
canvas{background:#243b28;border-radius:14px;max-width:100%}
a{color:#ffd23f}
.mut{opacity:.7;font-size:13px}
</style>
</head>
<body>
<h1>📡 Трекер онлайна 1Б42П</h1>
<div><a href="/">← На хаб</a> <span class="mut" id="upd"></span></div>
<h2>🟢 Сейчас онлайн: <span id="onlineTotal">…</span></h2>
<div class="cards" id="onlineCards"></div>
<h2>👣 Всего заходило: <span id="everTotal">…</span></h2>
<table id="everTable"><tr><th>Сайт</th><th>Гостей</th></tr></table>
<h2>🏆 Рекорд онлайна: <span id="maxOnline">…</span> <span class="mut" id="maxAt"></span></h2>
<h2>📈 Онлайн за 24 часа</h2>
<canvas id="graph" width="900" height="300"></canvas>
<div class="mut">Маяк шлёт heartbeat каждые 30 сек · онлайн = был в последние 90 сек · срез истории — раз в минуту</div>
<script>
var NAMES={hub:'🏠 Хаб',chaev:'🦖 Чаев',doom:'🔥 Дум',evaelph:'🧝 Эввград',smolgrad:'👑 Смолград',miqqil:'🛞 Танки',setden:'🌪️ Сетден',svyatoslav:'⚡ Святослав',denis:'🏝️ Денис',sasha:'⭐ Саша'};
var COLORS={hub:'#ffd23f',chaev:'#7CFC00',doom:'#ff6b35',evaelph:'#ff7bac',smolgrad:'#c9b458',miqqil:'#4fc3f7',setden:'#ba68c8',svyatoslav:'#ffee58',denis:'#80deea',sasha:'#ff4d4d'};
function nm(s){return NAMES[s]||s;}
async function load(){
 try{
  var r=await (await fetch('/api/stats')).json();
  if(!r.ok)return;
  document.getElementById('onlineTotal').textContent=r.onlineTotal;
  var oc=document.getElementById('onlineCards');oc.innerHTML='';
  Object.keys(NAMES).forEach(function(s){
   var d=document.createElement('div');d.className='card';
   d.innerHTML='<b>'+(r.online[s]||0)+'</b><small>'+nm(s)+'</small>';
   oc.appendChild(d);
  });
  document.getElementById('everTotal').textContent=r.everTotal;
  var t=document.getElementById('everTable');t.innerHTML='<tr><th>Сайт</th><th>Гостей</th></tr>';
  r.everPerSite.forEach(function(x){
   var tr=document.createElement('tr');
   tr.innerHTML='<td>'+nm(x.site)+'</td><td>'+x.n+'</td>';
   t.appendChild(tr);
  });
  document.getElementById('maxOnline').textContent=r.maxOnline;
  document.getElementById('maxAt').textContent=r.maxAt?('('+new Date(r.maxAt).toLocaleString('ru-RU')+')'):'';
  document.getElementById('upd').textContent='обновлено '+new Date().toLocaleTimeString('ru-RU');
  drawGraph(r.history||[]);
 }catch(e){}
}
function drawGraph(h){
 var cv=document.getElementById('graph'),ctx=cv.getContext('2d');
 ctx.clearRect(0,0,cv.width,cv.height);
 if(!h.length){ctx.fillStyle='#f5f0dc';ctx.fillText('Пока нет истории — заходи позже!',20,30);return;}
 var max=1;h.forEach(function(p){if(p.total>max)max=p.total;});
 var W=cv.width,H=cv.height,pad=30;
 function X(i){return pad+i*(W-2*pad)/Math.max(1,h.length-1);}
 function Y(v){return H-pad-v*(H-2*pad)/max;}
 ctx.strokeStyle='#556';ctx.beginPath();ctx.moveTo(pad,pad);ctx.lineTo(pad,H-pad);ctx.lineTo(W-pad,H-pad);ctx.stroke();
 ctx.fillStyle='#f5f0dc';ctx.font='12px sans-serif';
 for(var g=0;g<=4;g++){var v=Math.round(max*g/4);ctx.fillText(v,4,Y(v)+4);}
 var sites={};h.forEach(function(p){var ps=p.per_site||{};Object.keys(ps).forEach(function(s){sites[s]=1;});});
 Object.keys(sites).forEach(function(s){
  ctx.strokeStyle=COLORS[s]||'#fff';ctx.lineWidth=2;ctx.beginPath();
  h.forEach(function(p,i){var v=(p.per_site||{})[s]||0;if(i===0)ctx.moveTo(X(i),Y(v));else ctx.lineTo(X(i),Y(v));});
  ctx.stroke();
 });
 ctx.lineWidth=1;
 var lx=X(0);
 Object.keys(sites).forEach(function(s){
  ctx.fillStyle=COLORS[s]||'#fff';ctx.fillRect(lx,H-14,10,10);
  ctx.fillStyle='#f5f0dc';ctx.fillText(nm(s),lx+13,H-5);lx+=ctx.measureText(nm(s)).width+28;
 });
 var t0=new Date(h[0].ts),t1=new Date(h[h.length-1].ts);
 ctx.fillStyle='#f5f0dc';
 ctx.fillText(t0.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}),pad,H-16);
 var e=t1.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
 ctx.fillText(e,W-pad-ctx.measureText(e).width,H-16);
}
load();setInterval(load,30000);
</script>
</body>
</html>
