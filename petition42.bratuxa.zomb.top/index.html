<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Петиция 42: Киршику — купить кальян Фугоботу!</title>
<style>
html,body{margin:0;padding:0;background:#0d1428}
body{color:#fff;font-family:system-ui,sans-serif;text-align:center;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 14px 50px}
h1{font-size:clamp(24px,6vw,42px);margin:8px 0}h1 .y{color:#ffd700}
.card{max-width:620px;width:100%;background:#ffffff10;border:2px solid #ffd700;border-radius:14px;padding:16px;margin:10px 0}
.sub{color:#bbb;max-width:620px}
.count{font-size:22px;font-weight:bold;margin:8px 0}
.count b{color:#ffd700;font-size:30px}
input{font-size:16px;padding:12px;border-radius:10px;border:2px solid #2f5d3a;width:min(80vw,320px);margin:6px}
button{font-size:18px;font-weight:bold;border-radius:12px;padding:13px 24px;border:3px solid #8a6d00;background:linear-gradient(180deg,#ffd700,#c90);cursor:pointer;margin:6px}
button:active{transform:scale(.97)}
#list{max-width:620px;width:100%;text-align:left}
#list div{background:#ffffff0d;border-radius:8px;padding:6px 10px;margin:4px 0;font-size:15px}
footer{margin-top:16px;color:#777;font-size:13px}
a{color:#ffd700}
</style>
</head>
<body>
<h1>ПЕТИЦИЯ <span class="y">× 42</span> 🫖</h1>
<p class="sub">Мы, бойцы 1 Батальона 42 пропаганды, требуем:<br><b>Киршику — купить кальян Фугоботу!</b><br>Фугобот старается, гости ждут дыма. Справедливость должна восторжествовать.</p>
<div class="card">
<div class="count">✍️ Подписей: <b id="n">0</b> / 42</div>
<input id="name" placeholder="Твой позывной, боец..." maxlength="30">
<br><button id="sign">ПОДПИСАТЬ ✍️</button>
<div id="msg" style="min-height:24px;margin-top:6px"></div>
</div>
<div id="list"></div>
<footer>1Б42П • за 42! за босса! 🏆 • <a href="https://hub.bratuxa.zomb.top">хаб</a></footer>
<script>
const k='pet42_kalyan';
const get=()=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const save=a=>localStorage.setItem(k,JSON.stringify(a));
function render(){
 const a=get();
 document.getElementById('n').textContent=a.length;
 const l=document.getElementById('list');l.innerHTML='';
 a.slice().reverse().forEach((x,i)=>{const d=document.createElement('div');d.textContent='⚡ '+x; l.appendChild(d);});
 if(a.length>=42)document.getElementById('msg').textContent='🎉 42 ЕСТЬ! Киршик, гони кальян! 🏆';
}
document.getElementById('sign').onclick=()=>{
 const v=document.getElementById('name').value.trim();
 if(!v){document.getElementById('msg').textContent='впиши позывной сначала, боец!';return;}
 const a=get();a.push(v);save(a);document.getElementById('name').value='';
 document.getElementById('msg').textContent='подпись принята! за 42! ❤️';
 render();
};
render();
</script>
</body>
</html>
