<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>1Б42П: ШТУРМ 3D 🏆</title>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
:root{--gold:#f5c518;--bg:#0d0716;--panel:#1c102e;--line:#3d2457;--red:#ff3b3b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:#f2eafc;font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;min-height:100%;overflow:hidden}
#top{background:linear-gradient(180deg,#1c102e,#120a1f);border-bottom:2px solid var(--gold);padding:8px 10px}
#top h1{margin:0;font-size:18px;color:var(--gold);text-align:center}
#top .sub{text-align:center;font-size:11px;color:#b9a3d6}
#top .sub a{color:var(--gold)}
#res{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.pill{background:#000a;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.pill b{color:var(--gold)}
#hpwrap{max-width:640px;margin:6px auto 0;height:10px;background:#000a;border:1px solid var(--line);border-radius:6px;overflow:hidden}
#hpbar{height:100%;width:100%;background:linear-gradient(90deg,#37e05a,#b6ff5e);transition:width .15s}
#xpwrap{max-width:640px;margin:4px auto 0;height:8px;background:#000a;border:1px solid var(--line);border-radius:5px;overflow:hidden}
#xpbar{height:100%;width:0%;background:linear-gradient(90deg,#4fc3f7,#ff4fd8);transition:width .15s}
#lvlup{position:fixed;inset:0;background:rgba(5,2,10,.88);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#lvlBox{background:var(--panel);border:3px solid var(--gold);border-radius:16px;padding:20px;max-width:480px;width:100%;text-align:center}
#lvlBox h2{color:var(--gold);margin:0 0 10px}
#lvlCards{display:flex;flex-direction:column;gap:8px}
#lvlCards button{background:#2c1a4d;color:#fff;border:2px solid var(--gold);border-radius:10px;padding:12px;font-size:15px;cursor:pointer}
#lvlCards button small{color:#b9a3d6}
#bossbar{display:none;max-width:640px;margin:6px auto 0;padding:2px 8px;font-size:12px;color:#ffb3b3}
#bossbar .track{height:8px;background:#000a;border:1px solid var(--red);border-radius:5px;overflow:hidden}
#bosshp{height:100%;width:100%;background:var(--red)}
#wrap{position:relative;max-width:900px;margin:0 auto}
#cv{display:block;width:100%;height:calc(100vh - 210px);min-height:320px;background:#0a0512;touch-action:none}
#btns{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
#btns button{font-size:15px;font-weight:800;border-radius:12px;border:2px solid var(--gold);background:#000c;color:#fff;padding:12px 14px;cursor:pointer}
#btns button:disabled{opacity:.4}
#msg{position:absolute;left:0;right:0;top:8px;text-align:center;color:var(--gold);font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none;min-height:22px}
#shop{display:none;position:absolute;left:10px;top:10px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:10px;z-index:6}
#shop h3{margin:0 0 6px;color:var(--gold);font-size:15px}
#shop button{display:block;width:100%;margin:4px 0;background:#2c1a4d;color:#fff;border:1px solid var(--gold);border-radius:8px;padding:8px;font-size:13px;cursor:pointer}
#over{position:fixed;inset:0;background:rgba(5,2,10,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#overBox{background:var(--panel);border:3px solid var(--gold);border-radius:16px;padding:26px;max-width:440px;text-align:center}
#overBox button{background:var(--gold);color:#181006;font-weight:800;font-size:18px;border:none;border-radius:12px;padding:14px 22px;cursor:pointer;width:100%;margin-top:8px}
.hint{font-size:11px;color:#b9a3d6;text-align:center;padding:4px}
/* горизонталь: компактная шапка + канвас на всю высоту */
@media (orientation:landscape){
 #top{padding:4px 8px}
 #top h1{font-size:14px}
 #top .sub{display:none}
 #res{gap:4px;margin-top:4px}
 .pill{padding:2px 8px;font-size:11px}
 #hpwrap{margin-top:4px}
 #cv{height:calc(100vh - 110px);min-height:0}
 .hint{display:none}
 #btns button{padding:8px 10px;font-size:13px}
}
@media (max-height:500px){
 #top .sub{display:none}
 .hint{display:none}
 #cv{min-height:0}
}
</style>
</head>
<body>
<div id="top">
<h1>1Б42П: ШТУРМ 3D ⚔️</h1>
<div class="sub">арена Батальона в 3D · дойди до 42-й волны · <a href="https://hub.bratuxa.zomb.top">← Хаб 1Б42П</a></div>
<div id="res">
<span class="pill">⏱️ Время: <b id="rT">0:00</b></span>
<span class="pill">💠 Ур: <b id="rL">1</b></span>
<span class="pill">🌊 Волна: <b id="rW">0</b></span>
<span class="pill">🔥 Хайп: <b id="rH">0</b></span>
<span class="pill">🎟️ Фантики: <b id="rF">0</b></span>
<span class="pill">⚡ Комбо: <b id="rC">0</b></span>
<span class="pill">🏅 Рекорд: <b id="rB">0</b></span>
</div>
<div id="hpwrap"><div id="hpbar"></div></div>
<div id="bossbar">👹 БОСС<div class="track"><div id="bosshp"></div></div></div>
</div>
<div id="wrap">
<canvas id="cv"></canvas>
<div id="msg"></div>
<div id="btns">
<button id="btnShop">🛒</button>
<button id="btnV">🌪️ Вихрь</button>
<button id="btnZ">🚀 ZOV</button>
</div>
<div id="shop"><h3>🛒 Снаряга (фантики)</h3><div id="shopItems"></div></div>
</div>
<div class="hint">WASD/стрелки — движение · Пробел — рывок · E — вихрь · Q — ZOV · на телефоне — левый стик</div>
<div id="over"><div id="overBox">
<h2 id="overT">ШТУРМ ОКОНЧЕН</h2>
<p id="overP"></p>
<button onclick="location.reload()">ЕЩЁ РАЗ ⚔️</button>
</div></div>
<script>
/* ============ 1Б42П: ШТУРМ 3D — арена-экшен ============ */
var KEY='shturm42_v1';
var LEGEND_WAVE=42;
var WW=380,WH=380,IB=188; // остров 400x400 как у Дениса · вода-стена ±190
var TYPES={
 hater:{em:'😡',color:0xff5252,hp:30,dmg:8,spd:4.5,r:1.0,score:10,size:1.4},
 runner:{em:'🤡',color:0xffb300,hp:18,dmg:6,spd:8.5,r:0.9,score:15,size:1.2},
 tank:{em:'🦍',color:0x7b1fa2,hp:120,dmg:16,spd:2.8,r:1.4,score:30,size:2.0},
 boss:{em:'👹',color:0xb71c1c,hp:900,dmg:25,spd:3.5,r:1.8,score:300,size:3.0}
};
function upCost(base,lv){return Math.floor(base*Math.pow(2.2,lv));}
function waveComp(n){var c=4+2*n,boss=(n%5===0);if(boss)c+=3;return{count:c,boss:boss};}
function enemyHp(base,n){return Math.round(base*(1+0.25*(n-1)));}
var S={best:0};
try{var sv=JSON.parse(localStorage.getItem(KEY)||'{}');if(sv.best)S.best=sv.best;}catch(e){}
function saveBest(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var cv=document.getElementById('cv');
var P={x:0,z:0,hp:100,maxhp:100,dmg:12,spd:14,range:6,atkCd:0,atkRate:0.45,dashCd:0,dashT:0,vCd:0,zCd:0,swing:0,face:0,up:{dmg:0,hp:0,spd:0,range:0}};
var G={wave:0,hype:0,fant:0,combo:0,best:0,foes:[],parts:[],drops:[],rings:[],spawnQ:[],spawnT:0,breather:2,over:false,shake:0,boss:null,flash:0};
/* ---------- 3D ---------- */
var scene=null,camera=null,renderer=null,playerG=null,batMesh=null,rangeRing=null,flashLight=null;
var emojiTex={};
function texOf(em){
 if(emojiTex[em])return emojiTex[em];
 var c=document.createElement('canvas');c.width=c.height=128;
 var g=c.getContext('2d');g.font='100px sans-serif';g.textAlign='center';g.textBaseline='middle';
 g.fillText(em,64,70);
 var t=new THREE.CanvasTexture(c);emojiTex[em]=t;return t;
}
function textTex(txt,color){
 var c=document.createElement('canvas');c.width=256;c.height=128;
 var g=c.getContext('2d');g.font='bold 84px sans-serif';g.textAlign='center';g.textBaseline='middle';
 g.fillStyle=color||'#f5c518';g.fillText(txt,128,66);
 return new THREE.CanvasTexture(c);
}
function emSprite(em,s){
 var m=new THREE.SpriteMaterial({map:texOf(em),transparent:true,depthWrite:false});
 var sp=new THREE.Sprite(m);sp.scale.set(s,s,1);return sp;
}
function barSprites(w){
 var bgm=new THREE.SpriteMaterial({color:0x000000,transparent:true,opacity:0.7,depthWrite:false});
 var fgm=new THREE.SpriteMaterial({color:0xff3b3b,transparent:true,opacity:0.95,depthWrite:false});
 var bg=new THREE.Sprite(bgm),fg=new THREE.Sprite(fgm);
 bg.scale.set(w,0.28,1);fg.scale.set(w,0.22,1);
 return{bg:bg,fg:fg,w:w};
}
/* ---------- остров как у Дениса: зоны + рельеф одним мешем ---------- */
function ss01(e0,e1,x){var t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);}
function rawZoneH(x,z){
 if(z>=125)return 0;                 // пляж
 if(z<=-130)return 3.6;              // горы
 if(x>=140&&z<=-30)return 3.6;       // хребет
 if(x>=40&&z>-30&&z<125)return 2.0;  // лес
 return 0.8;                         // город
}
function groundHeight(x,z){
 var r=10;
 var h=(rawZoneH(x,z)+rawZoneH(x+r,z)+rawZoneH(x-r,z)+rawZoneH(x,z+r)+rawZoneH(x,z-r))/5;
 if(rawZoneH(x,z)>3)h+=(Math.sin(x*0.3)*Math.cos(z*0.27))*0.35;
 return h;
}
function GY(x,z){return groundHeight(x,z);}
var ZONE_COL=null;
function zoneColor(x,z,out){
 if(!ZONE_COL){ZONE_COL={beach:new THREE.Color(0xd9b84a),city:new THREE.Color(0x2a2a35),
  forest:new THREE.Color(0x1e6a34),mtn:new THREE.Color(0x6b6f75)};}
 var r=rawZoneH(x,z);
 if(z>=125)out.copy(ZONE_COL.beach);
 else if(r>3)out.copy(ZONE_COL.mtn);
 else if(r>1)out.copy(ZONE_COL.forest);
 else out.copy(ZONE_COL.city);
 return out;
}
var ground=null,waterMesh=null;
function buildTerrain(){
 var g=new THREE.PlaneGeometry(400,400,100,100);
 var pos=g.attributes.position,cols=[],c=new THREE.Color(),wx=0,wz=0;
 for(var i=0;i<pos.count;i++){
  wx=pos.getX(i);wz=-pos.getY(i);
  pos.setZ(i,groundHeight(wx,wz));
  zoneColor(wx,wz,c);cols.push(c.r,c.g,c.b);
 }
 g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));
 g.computeVertexNormals();
 ground=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
 ground.rotation.x=-Math.PI/2;scene.add(ground);
 waterMesh=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),
  new THREE.MeshLambertMaterial({color:0x0d6fa8,transparent:true,opacity:0.92}));
 waterMesh.rotation.x=-Math.PI/2;waterMesh.position.y=-1.2;scene.add(waterMesh);
}
/* пальмы: общие материалы на всех, база y=0 (поднимет liftIsland) */
var _palmTrunkM=null,_palmTrunkM2=null,_palmLeafM=null,_palmLeafM2=null,_palmNutM=null;
function palmMats(){
 if(_palmTrunkM)return;
 _palmTrunkM=new THREE.MeshLambertMaterial({color:0x6b4a2b});
 _palmTrunkM2=new THREE.MeshLambertMaterial({color:0x7a5633});
 _palmLeafM=new THREE.MeshLambertMaterial({color:0x1faa4a});
 _palmLeafM2=new THREE.MeshLambertMaterial({color:0x27c45c});
 _palmNutM=new THREE.MeshLambertMaterial({color:0x6b4a1a});
}
function palm(x,z,s){
 palmMats();s=s||1;
 var g=new THREE.Group(),i=0,a=0;
 var px=0,segH=4.6*s,lean=(Math.random()-0.5)*0.3;
 for(i=0;i<3;i++){var t=new THREE.Mesh(new THREE.CylinderGeometry(0.42*s*(1-i*0.1),0.55*s*(1-i*0.1),segH,7),i%2?_palmTrunkM2:_palmTrunkM);
  px+=lean*segH*0.3;t.position.set(px,segH/2+i*segH*0.94,0);t.rotation.z=-lean*0.3;g.add(t);}
 var topX=px,topY=segH*2.9;
 for(i=0;i<6;i++){a=i/6*Math.PI*2+Math.random()*0.3;
  var leaf=new THREE.Mesh(new THREE.ConeGeometry(0.95*s,8.5*s,5),i%2?_palmLeafM2:_palmLeafM);
  leaf.scale.z=0.38;leaf.position.set(topX+Math.cos(a)*3.6*s,topY-1.2*s,Math.sin(a)*3.6*s);
  leaf.rotation.set(Math.sin(a)*1.95,0,-Math.cos(a)*1.95);g.add(leaf);}
 for(i=0;i<3;i++){var nut=new THREE.Mesh(new THREE.SphereGeometry(0.35*s,8,6),_palmNutM);
  nut.position.set(topX+Math.cos(i*2.1+1)*0.9*s,topY-0.6*s,Math.sin(i*2.1+1)*0.9*s);g.add(nut);}
 g.position.set(x,0,z);scene.add(g);return g;
}
function palmRows(){
 var x=0;
 for(x=-120;x<=120;x+=28){palm(x,132,1);palm(x+14,118,0.9);}
 palm(-30,100,1.1);palm(30,100,1);palm(-60,60,1.2);palm(60,60,1);palm(0,40,1);
}
function liftIsland(){
 if(!scene)return;
 scene.children.slice().forEach(function(o){
  if(o===ground||o===waterMesh||o.isLight||o.isPoints)return;
  if(o.position.y>60)return;
  try{o.position.y+=groundHeight(o.position.x,o.position.z);}catch(e){}
 });
}
function initGL(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x0d0716);
 scene.fog=new THREE.Fog(0x0d0716,70,340);
 camera=new THREE.PerspectiveCamera(55,1,0.1,900);
 renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
 scene.add(new THREE.HemisphereLight(0xbfb3ff,0x1c102e,0.9));
 var dir=new THREE.DirectionalLight(0xfff2c0,1.1);dir.position.set(20,40,10);scene.add(dir);
 flashLight=new THREE.PointLight(0xff6a00,0,60);flashLight.position.set(0,6,0);scene.add(flashLight);
 buildTerrain();
 palmRows();
 var ring=new THREE.Mesh(new THREE.RingGeometry(4.4,5.4,48),new THREE.MeshBasicMaterial({color:0xf5c518,transparent:true,opacity:0.6,side:THREE.DoubleSide}));
 ring.rotation.x=-Math.PI/2;ring.position.y=0.06;scene.add(ring);
 var t42=new THREE.Sprite(new THREE.SpriteMaterial({map:textTex('42'),transparent:true,depthWrite:false}));
 t42.scale.set(6,3,1);t42.position.set(0,2.5,0);scene.add(t42);
 /* братуха в шубе: тело-шуба + папаха + бита */
 playerG=new THREE.Group();
 var coat=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.7,0.9),new THREE.MeshLambertMaterial({color:0x6d4c41}));
 coat.position.y=1.0;playerG.add(coat);
 var collar=new THREE.Mesh(new THREE.TorusGeometry(0.42,0.18,8,16),new THREE.MeshLambertMaterial({color:0x4e342e}));
 collar.position.y=1.9;collar.rotation.x=Math.PI/2;playerG.add(collar);
 var head=new THREE.Mesh(new THREE.SphereGeometry(0.45,16,12),new THREE.MeshLambertMaterial({color:0xffcc99}));
 head.position.y=2.3;playerG.add(head);
 var hat=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.55,0.5,12),new THREE.MeshLambertMaterial({color:0x212121}));
 hat.position.y=2.75;playerG.add(hat);
 batMesh=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.12,1.8,8),new THREE.MeshLambertMaterial({color:0x8d6e63}));
 batMesh.position.set(0.9,1.2,0);batMesh.rotation.z=0.5;playerG.add(batMesh);
 scene.add(playerG);
 rangeRing=new THREE.Mesh(new THREE.RingGeometry(P.range-0.15,P.range,48),
  new THREE.MeshBasicMaterial({color:0x4fc3f7,transparent:true,opacity:0.25,side:THREE.DoubleSide}));
 rangeRing.rotation.x=-Math.PI/2;rangeRing.position.y=0.04;scene.add(rangeRing);
 liftIsland();
 fit();
}
function fit(){
 try{
  var r=cv.getBoundingClientRect(),w=Math.max(300,r.width),h=Math.max(300,r.height||r.width*0.6);
  if(renderer){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
 }catch(e){}
}
window.addEventListener('resize',fit);
window.addEventListener('orientationchange',function(){setTimeout(fit,100);setTimeout(fit,400);});
try{if(window.visualViewport)visualViewport.addEventListener('resize',fit);}catch(e){}
/* ---------- ввод ---------- */
var keys={};
document.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;
 if(e.key===' '){dash();e.preventDefault();}
 if(e.key.toLowerCase()==='e'||e.key.toLowerCase()==='у')vortex();
 if(e.key.toLowerCase()==='q'||e.key.toLowerCase()==='й')zov();});
document.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
var stick={on:false,id:null,x0:0,y0:0,dx:0,dy:0};
cv.addEventListener('touchstart',function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
 if(t.clientX<window.innerWidth/2&&!stick.on){stick.on=true;stick.id=t.identifier;stick.x0=t.clientX;stick.y0=t.clientY;stick.dx=0;stick.dy=0;}}
 e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
 if(stick.on&&t.identifier===stick.id){stick.dx=(t.clientX-stick.x0)/50;stick.dy=(t.clientY-stick.y0)/50;
  var l=Math.hypot(stick.dx,stick.dy);if(l>1){stick.dx/=l;stick.dy/=l;}}}
 e.preventDefault();},{passive:false});
function touchEnd(e){for(var i=0;i<e.changedTouches.length;i++){if(stick.on&&e.changedTouches[i].identifier===stick.id){stick.on=false;stick.dx=0;stick.dy=0;}}}
cv.addEventListener('touchend',touchEnd);cv.addEventListener('touchcancel',touchEnd);
/* ---------- helpers ---------- */
function msg(t){try{document.getElementById('msg').textContent=t;}catch(e){}}
function blip(f,d){try{var C=blip.ac=blip.ac||new (window.AudioContext||window.webkitAudioContext)();if(C.state==='suspended')C.resume();
 var o=C.createOscillator(),g=C.createGain();o.type='square';o.frequency.value=f;d=d||0.12;
 g.gain.setValueAtTime(0.07,C.currentTime);g.gain.exponentialRampToValueAtTime(0.001,C.currentTime+d);
 o.connect(g);g.connect(C.destination);o.start();o.stop(C.currentTime+d+0.02);}catch(e){}}
function fmt(n){n=Math.floor(n);if(n>=1e6)return (n/1e6).toFixed(2)+'M';if(n>=1e3)return (n/1e3).toFixed(1)+'K';return String(n);}
/* ---------- волны ---------- */
function edge(){
 /* остров: кольцо вокруг игрока r=42..55, кламп к воде ±IB — волны всегда в бою */
 var a=Math.random()*Math.PI*2,r=42+Math.random()*13;
 var x=P.x+Math.cos(a)*r,z=P.z+Math.sin(a)*r;
 x=Math.max(-IB,Math.min(IB,x));z=Math.max(-IB,Math.min(IB,z));
 return{x:x,z:z};
}
function startWave(n){
 G.wave=n;var c=waveComp(n);
 G.spawnQ=[];
 for(var i=0;i<c.count;i++){var r=Math.random();
  var t=n<3?'hater':(r<0.55?'hater':(r<0.8?'runner':'tank'));
  G.spawnQ.push(t);}
 if(c.boss)G.spawnQ.push('boss');
 G.spawnT=0;
 msg(n%5===0?'👹 ВОЛНА '+n+' — БОСС!':'🌊 Волна '+n);
 blip(n%5===0?160:520,0.2);
 try{document.getElementById('rW').textContent=n;}catch(e){}
 updateShop();
}
function spawnFoe(t){
 var T=TYPES[t],p=edge();
 var f={t:t,em:T.em,x:p.x,z:p.z,hp:enemyHp(T.hp,G.wave),maxhp:enemyHp(T.hp,G.wave),
  dmg:T.dmg,spd:T.spd*(0.9+Math.random()*0.2),r:T.r,score:T.score,cd:0,chg:0,g:null};
 if(scene){
  var g=new THREE.Group();
  var body=new THREE.Mesh(new THREE.BoxGeometry(T.size,T.size,T.size),new THREE.MeshLambertMaterial({color:T.color}));
  body.position.y=T.size/2;g.add(body);
  var face=emSprite(T.em,T.size*1.1);face.position.y=T.size+1.1;g.add(face);
  var bars=barSprites(Math.max(T.size,1.6));bars.bg.position.y=T.size+0.4;bars.fg.position.y=T.size+0.4;
  g.add(bars.bg);g.add(bars.fg);f.bars=bars;
  g.position.set(f.x,0,f.z);scene.add(g);f.g=g;
 }
 if(t==='boss'){f.x=0;f.z=-WH/2+2;if(f.g)f.g.position.set(f.x,0,f.z);
  G.boss=f;try{document.getElementById('bossbar').style.display='block';}catch(e){}blip(120,0.4);}
 G.foes.push(f);
}
function hurtPlayer(d){
 if(P.dashT>0||G.over)return;
 P.hp-=d;G.combo=0;G.shake=0.5;blip(140,0.2);
 if(P.hp<=0){P.hp=0;gameOver();}
}
function gameOver(){
 G.over=true;
 if(G.wave>S.best){S.best=G.wave;saveBest();}
 var legend=G.wave>=LEGEND_WAVE?'<br>🏆 ЛЕГЕНДА 42! Батальон гордится!':'';
 document.getElementById('overT').textContent='ШТУРМ ОКОНЧЕН НА '+G.wave+' ВОЛНЕ';
 document.getElementById('overP').innerHTML='🔥 Хайп: '+fmt(G.hype)+'<br>⚡ Лучшее комбо: '+G.best+'<br>🏅 Рекорд: '+S.best+legend+'<br><br>Мы уже победили 🏆';
 document.getElementById('over').style.display='flex';
 blip(110,0.5);
}
function dash(){if(P.dashCd>0||G.over)return;P.dashCd=2;P.dashT=0.25;blip(700,0.08);}
function vortex(){
 if(G.over||P.vCd>0)return;P.vCd=6;
 var R=10,done=0;
 for(var i=G.foes.length-1;i>=0;i--){var f=G.foes[i];
  if(Math.hypot(f.x-P.x,f.z-P.z)<R+f.r){damageFoe(f,P.dmg*3,P.x,P.z);done++;}}
 ringFx(P.x,P.z,R,0xff4fd8);
 burst(P.x,P.z,'🌪️',8);msg(done?('🌪️ Вихрь смёл '+done+'!'):'🌪️ Вихрь в пустоту...');blip(300,0.25);
}
function zov(){
 if(G.over||P.zCd>0)return;
 if(G.fant<25){msg('Нужно 25 🎟️ на ZOV!');blip(200);return;}
 G.fant-=25;P.zCd=12;
 var R=17;
 for(var i=G.foes.length-1;i>=0;i--){var f=G.foes[i];
  if(Math.hypot(f.x-P.x,f.z-P.z)<R+f.r)damageFoe(f,P.dmg*8,P.x,P.z);}
 G.shake=1.2;G.flash=3;ringFx(P.x,P.z,R,0xff6a00);
 burst(P.x,P.z,'🚀',20);msg('🚀 РАКЕТА ZOV!');blip(90,0.5);
}
function damageFoe(f,d,fx,fz){
 f.hp-=d;
 var dx=f.x-fx,dz=f.z-fz,l=Math.hypot(dx,dz)||1;
 f.x+=dx/l*1.0;f.z+=dz/l*1.0;
 if(f.g){f.g.position.x=f.x;f.g.position.z=f.z;}
 burst(f.x,f.z,'💥',2);
 if(f.hp<=0)killFoe(f);
 else blip(600,0.05);
}
function killFoe(f){
 var i=G.foes.indexOf(f);if(i>=0)G.foes.splice(i,1);
 if(f.g&&scene){scene.remove(f.g);}
 G.combo++;G.best=Math.max(G.best,G.combo);
 var gain=Math.round(f.score*(1+G.combo*0.1));
 G.hype+=gain;
 if(Math.random()<0.35)dropFx('f',f.x,f.z,1+Math.floor(f.score/15));
 else if(Math.random()<0.08)dropFx('h',f.x,f.z,20);
 burst(f.x,f.z,f.em,5);blip(880,0.08);
 if(f.t==='boss'){G.boss=null;try{document.getElementById('bossbar').style.display='none';}catch(e){}
  for(var j=0;j<5;j++)dropFx('f',f.x+(Math.random()-0.5)*5,f.z+(Math.random()-0.5)*5,10);
  msg('👹 БОСС ПОВЕРЖЕН! +'+gain+' 🔥');}
}
function burst(x,z,em,n){
 for(var i=0;i<n;i++){
  var sp=scene?emSprite(em,1):null;
  if(sp){sp.position.set(x,1,z);scene.add(sp);}
  G.parts.push({x:x,z:z,vx:(Math.random()-0.5)*14,vy:4+Math.random()*6,vz:(Math.random()-0.5)*14,t:0.5,sp:sp});
 }
}
function dropFx(k,x,z,v){
 var sp=scene?emSprite(k==='f'?'🎟️':'❤️',1.1):null;
 if(sp){sp.position.set(x,0.8,z);scene.add(sp);}
 G.drops.push({k:k,x:x,z:z,v:v,t:0,sp:sp});
}
function ringFx(x,z,R,color){
 if(!scene)return;
 var m=new THREE.Mesh(new THREE.RingGeometry(R-0.6,R,48),
  new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.9,side:THREE.DoubleSide}));
 m.rotation.x=-Math.PI/2;m.position.set(x,0.1,z);scene.add(m);
 G.rings.push({m:m,t:0.4});
}
/* магазин */
var SHOP=[
 {id:'dmg',n:'💪 Урон +4',base:30},{id:'hp',n:'❤️ Макс HP +25',base:30},
 {id:'spd',n:'🥾 Скорость +10%',base:50},{id:'range',n:'🎯 Радиус +1',base:40}];
function updateShop(){
 var el=document.getElementById('shopItems');if(!el)return;el.innerHTML='';
 SHOP.forEach(function(o){
  var lv=P.up[o.id],c=upCost(o.base,lv);
  var b=document.createElement('button');
  b.textContent=o.n+' · '+lv+' ур. · '+c+' 🎟️';
  b.onclick=function(){
   if(G.fant<c){msg('Не хватает фантиков! 🎟️');blip(200);return;}
   G.fant-=c;P.up[o.id]++;
   if(o.id==='dmg')P.dmg+=4;
   if(o.id==='hp'){P.maxhp+=25;P.hp=Math.min(P.maxhp,P.hp+25);}
   if(o.id==='spd')P.spd*=1.1;
   if(o.id==='range'){P.range+=1;if(rangeRing){scene.remove(rangeRing);
    rangeRing=new THREE.Mesh(new THREE.RingGeometry(P.range-0.15,P.range,48),
     new THREE.MeshBasicMaterial({color:0x4fc3f7,transparent:true,opacity:0.25,side:THREE.DoubleSide}));
    rangeRing.rotation.x=-Math.PI/2;rangeRing.position.y=0.04;scene.add(rangeRing);}}
   blip(760);updateShop();
  };

 });

document.getElementById('btnShop').onclick=function(){var s=document.getElementById('shop');s.style.display=s.style.display==='block'?'none':'block';updateShop();blip(600);};
document.getElementById('btnV').onclick=vortex;

/* ---------- цикл: updatePhysics / checkCollisions / render + gameLoop ---------- */
// Физика: движение, таймеры, спавн волн, движение врагов, частицы. Без урона и подбора.
function updatePhysics(dt){
 var mx=0,mz=0;
 if(keys['a']||keys['arrowleft']||keys['ф'])mx-=1;
 if(keys['d']||keys['arrowright']||keys['в'])mx+=1;
 if(keys['w']||keys['arrowup']||keys['ц'])mz-=1;
 if(keys['s']||keys['arrowdown']||keys['ы'])mz+=1;
 if(stick.on){mx=stick.dx;mz=stick.dy;}
 var ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml;}
 var sp=P.spd*(P.dashT>0?2.6:1);
 P.x=Math.max(-WW/2+1,Math.min(WW/2-1,P.x+mx*sp*dt));
 P.z=Math.max(-WH/2+1,Math.min(WH/2-1,P.z+mz*sp*dt));
 if(ml>0.1)P.face=Math.atan2(mx,mz);
 if(P.dashCd>0)P.dashCd-=dt;if(P.dashT>0)P.dashT-=dt;
 if(P.vCd>0)P.vCd-=dt;if(P.zCd>0)P.zCd-=dt;
 if(P.swing>0)P.swing-=dt;
 if(P.atkCd>0)P.atkCd-=dt;
 if(G.spawnQ.length){G.spawnT-=dt;if(G.spawnT<=0){G.spawnT=0.5;spawnFoe(G.spawnQ.shift());}}
 else if(!G.foes.length){G.breather-=dt;
  if(G.breather<=0){G.breather=4;G.fant+=5+G.wave;startWave(G.wave+1);}}
 for(var j=G.foes.length-1;j>=0;j--){var e=G.foes[j];
  var ex=P.x-e.x,ez=P.z-e.z,el=Math.hypot(ex,ez)||1;
  var esp=e.spd;
  if(e.t==='boss'){e.chg-=dt;if(e.chg<=0){e.chg=3;esp=e.spd*3;burst(e.x,e.z,'👹',3);blip(150,0.2);}}
  var step=Math.min(esp*dt,el);
  e.x+=ex/el*step;e.z+=ez/el*step;
  for(var q=0;q<G.foes.length;q++){if(q===j)continue;var o=G.foes[q];
   var sx=e.x-o.x,sz2=e.z-o.z,sl=Math.hypot(sx,sz2);
   if(sl>0.01&&sl<e.r+o.r){e.x+=sx/sl*dt*2;e.z+=sz2/sl*dt*2;}}
  e.x=Math.max(-WW/2+1,Math.min(WW/2-1,e.x));e.z=Math.max(-WH/2+1,Math.min(WH/2-1,e.z));
  if(e.g){e.g.position.x=e.x;e.g.position.z=e.z;
   if(e.bars)e.bars.fg.scale.x=e.bars.w*Math.max(e.hp,0)/e.maxhp;}
  if(e.cd>0)e.cd-=dt;
 }
 for(var p=G.parts.length-1;p>=0;p--){var pt=G.parts[p];pt.t-=dt;
  if(pt.sp){pt.sp.position.x+=pt.vx*dt;pt.sp.position.y+=pt.vy*dt;pt.sp.position.z+=pt.vz*dt;
   pt.sp.material.opacity=Math.max(pt.t*2,0);}
  if(pt.t<=0){if(pt.sp)scene.remove(pt.sp);G.parts.splice(p,1);}}
 for(var ri=G.rings.length-1;ri>=0;ri--){var rg=G.rings[ri];rg.t-=dt;
  rg.m.scale.multiplyScalar(1+dt*3);rg.m.material.opacity=Math.max(rg.t*2,0);
  if(rg.t<=0){scene.remove(rg.m);G.rings.splice(ri,1);}}
 if(G.shake>0)G.shake-=dt*2;
 if(G.flash>0){G.flash-=dt*4;flashLight.intensity=Math.max(G.flash*40,0);flashLight.position.set(P.x,6,P.z);}
}
// Коллизии: авто-атака, урон от врагов, подбор дропов.
function checkCollisions(dt){
 if(P.atkCd<=0&&G.foes.length){
  var bi=-1,bd=1e9;
  for(var i=0;i<G.foes.length;i++){var f=G.foes[i];var d=Math.hypot(f.x-P.x,f.z-P.z)-f.r;
   if(d<bd){bd=d;bi=i;}}
  if(bi>=0&&bd<P.range){P.atkCd=P.atkRate;P.swing=0.2;damageFoe(G.foes[bi],P.dmg,P.x,P.z);}
 }
 for(var j=G.foes.length-1;j>=0;j--){var e=G.foes[j];
  var el=Math.hypot(P.x-e.x,P.z-e.z)||1;
  if(el<e.r+1&&e.cd<=0){e.cd=0.8;hurtPlayer(e.dmg);}
 }
 for(var k=G.drops.length-1;k>=0;k--){var dr=G.drops[k];dr.t+=dt;
  if(dr.sp)dr.sp.position.y=0.8+Math.sin(dr.t*4)*0.2;
  if(Math.hypot(dr.x-P.x,dr.z-P.z)<2){G.drops.splice(k,1);if(dr.sp)scene.remove(dr.sp);
   if(dr.k==='f'){G.fant+=dr.v;blip(990,0.05);}
   else{P.hp=Math.min(P.maxhp,P.hp+dr.v);msg('+'+dr.v+' HP ❤️');blip(700);}}}
}
// Рендер: камера + братуха + кадр + худ.
function render(){
 playerG.position.set(P.x,0,P.z);
 playerG.rotation.y=P.face;
 batMesh.rotation.z=P.swing>0?-1.2:0.5;
 rangeRing.position.set(P.x,0.04,P.z);
 var shx=G.shake>0?(Math.random()-0.5)*G.shake:0,shz=G.shake>0?(Math.random()-0.5)*G.shake:0;
 camera.position.set(P.x*0.85+shx,26,P.z*0.85+15+shz);
 camera.lookAt(P.x*0.9,0,P.z*0.9);
 renderer.render(scene,camera);
 hud();
}
// Главный цикл от эвв эльфа: физика → коллизии → рендер → следующий кадр.
function gameLoop(timestamp){
 if(!renderer||G.over){gameLoop._running=true;requestAnimationFrame(gameLoop);return;}
 var dt=gameLoop._dt();
 updatePhysics(dt);
 checkCollisions(dt);
 render();
 gameLoop._running=true;
 requestAnimationFrame(gameLoop);
}
gameLoop._last=0;
gameLoop._running=false;
gameLoop._dt=function(){
 var now=Date.now(),dt=Math.min((now-(gameLoop._last||now))/1000,0.05);
 gameLoop._last=now;return dt;
};
// frame() оставлен как алиас ради совместимости: вся игра теперь на gameLoop.
function frame(){
 if(gameLoop._running)return gameLoop(timestamp_now());
 return gameLoop();
}
function timestamp_now(){return Date.now();}
function hud(){
 try{
 document.getElementById('rH').textContent=fmt(G.hype);
 document.getElementById('rF').textContent=fmt(G.fant);
 document.getElementById('rC').textContent=G.combo;
 document.getElementById('rB').textContent=S.best;
 document.getElementById('hpbar').style.width=(100*P.hp/P.maxhp)+'%';
 if(G.boss)document.getElementById('bosshp').style.width=(100*Math.max(G.boss.hp,0)/G.boss.maxhp)+'%';
 document.getElementById('btnV').disabled=P.vCd>0;
 document.getElementById('btnZ').disabled=(P.zCd>0||G.fant<25);
 }catch(e){}
}
/* старт */
updateShop();
try{document.getElementById('rB').textContent=S.best;}catch(e){}
try{
 if(typeof THREE==='undefined')throw new Error('no3d');
 initGL();
 msg('🌊 Волна 1 скоро... держись, братуха!');
 requestAnimationFrame(gameLoop);
}catch(e){msg('WebGL недоступен 😢 зайди с другого устройства');}
/* крючок для тестов */
window.__shturm={waveComp:waveComp,enemyHp:enemyHp,upCost:upCost,types:Object.keys(TYPES),gameLoop:gameLoop,updatePhysics:updatePhysics,checkCollisions:checkCollisions,render:render,frame:frame};
</script>
